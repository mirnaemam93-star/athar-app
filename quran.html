<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم | أَثَر</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Cairo',sans-serif;
    background:#f6f0e5;
    color:#123f32;
    min-height:100vh;
    padding-bottom:35px;
}


/* =========================
   HEADER
========================= */

.header{

    background:linear-gradient(145deg,#063d2d,#12634a);

    color:white;

    padding:18px 18px 30px;

    border-radius:0 0 38px 38px;

    box-shadow:0 8px 25px rgba(0,0,0,.15);

}

.top{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.back-btn{

    width:45px;

    height:45px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.1);

    color:white;

    font-size:22px;

    cursor:pointer;

}

.title{

    text-align:center;

    flex:1;

}

.title h1{

    color:#e4c568;

    font-size:27px;

    font-weight:800;

}

.title p{

    font-size:11px;

    letter-spacing:3px;

    opacity:.8;

    margin-top:2px;

}

.header-space{

    width:45px;

}


/* =========================
   CONTAINER
========================= */

.container{

    width:92%;

    max-width:700px;

    margin:22px auto;

}


/* =========================
   SEARCH
========================= */

.search-box{

    background:#fffdf8;

    border-radius:22px;

    padding:8px;

    display:flex;

    align-items:center;

    box-shadow:0 7px 25px rgba(24,55,42,.08);

    margin-bottom:18px;

}

.search-icon{

    font-size:21px;

    padding:0 10px;

}

.search-box input{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    font-family:inherit;

    font-size:15px;

    color:#123f32;

    padding:12px 5px;

}

.search-box input::placeholder{

    color:#999;

}


/* =========================
   DAILY AYAH
========================= */

.daily-ayah{

    background:#fffaf0;

    border:1px solid #e7d49d;

    border-radius:25px;

    padding:20px;

    text-align:center;

    margin-bottom:22px;

    box-shadow:0 7px 22px rgba(24,55,42,.06);

}

.daily-ayah-title{

    color:#146044;

    font-size:17px;

    font-weight:800;

    margin-bottom:10px;

}

.daily-ayah-text{

    font-family:'Amiri',serif;

    font-size:23px;

    line-height:2;

    color:#171717;

}

.daily-ayah-source{

    color:#8a7133;

    font-size:12px;

    margin-top:5px;

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

}

.section-title h2{

    font-size:22px;

    font-weight:800;

}

.section-title span{

    color:#8a7133;

    font-size:12px;

}


/* =========================
   SURAH LIST
========================= */

.surah-list{

    display:flex;

    flex-direction:column;

    gap:10px;

}

.surah{

    width:100%;

    border:1px solid #eee3d0;

    background:#fffdf8;

    border-radius:22px;

    padding:14px;

    display:flex;

    align-items:center;

    gap:13px;

    cursor:pointer;

    transition:.2s;

    text-align:right;

    font-family:inherit;

}

.surah:active{

    transform:scale(.98);

}

.surah-number{

    min-width:43px;

    height:43px;

    border-radius:15px;

    background:#e8d8a9;

    color:#705b2c;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:800;

}

.surah-info{

    flex:1;

}

.surah-name{

    font-family:'Amiri',serif;

    font-size:24px;

    color:#063d2d;

    font-weight:700;

}

.surah-meta{

    font-size:11px;

    color:#888;

    margin-top:2px;

}

.arrow{

    color:#8a7133;

    font-size:20px;

}


/* =========================
   NO RESULT
========================= */

.no-result{

    display:none;

    background:#fffdf8;

    border-radius:22px;

    padding:30px 20px;

    text-align:center;

    color:#777;

}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .container{

        width:91%;

    }

    .surah{

        padding:12px;

    }

    .surah-number{

        min-width:40px;

        height:40px;

    }

    .surah-name{

        font-size:22px;

    }

    .daily-ayah-text{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="top">

        <button
            class="back-btn"
            onclick="goHome()">

            →

        </button>


        <div class="title">

            <h1>
                القرآن الكريم
            </h1>

            <p>
                HOLY QURAN
            </p>

        </div>


        <div class="header-space"></div>

    </div>

</header>



<main class="container">


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-box">

        <div class="search-icon">
            🔎
        </div>

        <input
            type="text"
            id="searchInput"
            placeholder="ابحث عن سورة..."
            oninput="searchSurahs()">

    </div>



    <!-- =========================
         AYAH
    ========================= -->

    <section class="daily-ayah">

        <div class="daily-ayah-title">
            ✦ آية اليوم ✦
        </div>

        <div class="daily-ayah-text">
            ﴿ وَاذْكُر رَّبَّكَ إِذَا نَسِيتَ ﴾
        </div>

        <div class="daily-ayah-source">
            سورة الكهف — الآية 24
        </div>

    </section>



    <!-- =========================
         TITLE
    ========================= -->

    <div class="section-title">

        <h2>
            سور القرآن
        </h2>

        <span>
            114 سورة
        </span>

    </div>



    <!-- =========================
         SURAH LIST
    ========================= -->

    <div
        class="surah-list"
        id="surahList">
    </div>


    <div
        class="no-result"
        id="noResult">

        🔎

        <br><br>

        لم نجد سورة بهذا الاسم.

    </div>


</main>

/* =========================
   إنشاء قائمة السور
========================= */

function renderSurahs(list){

    const container =
        document.getElementById("surahList");

    const noResult =
        document.getElementById("noResult");


    container.innerHTML = "";


    if(list.length === 0){

        noResult.style.display = "block";

        return;

    }


    noResult.style.display = "none";


    list.forEach(function(surah){

        const number =
            surahs.indexOf(surah) + 1;

        const button =
            document.createElement("button");

        button.className = "surah";


        button.onclick = function(){

            openSurah(number);

        };


        button.innerHTML = `

            <div class="surah-number">
                ${number}
            </div>

            <div class="surah-info">

                <div class="surah-name">
                    ${surah[0]}
                </div>

                <div class="surah-meta">
                    ${surah[1]} آية
                </div>

            </div>

            <div class="arrow">
                ←
            </div>

        `;


        container.appendChild(button);

    });

}


/* =========================
   فتح السورة
========================= */

function openSurah(number){

    window.location.href =
        "surah.html?surah=" +
        number;

}


/* =========================
   البحث
========================= */

function searchSurahs(){

    const input =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        surahs.filter(function(surah){

            return surah[0]
                .toLowerCase()
                .includes(input);

        });


    renderSurahs(filtered);

}


/* =========================
   الرجوع للرئيسية
========================= */

function goHome(){

    window.location.href = "index.html";

}


/* تشغيل القائمة */

renderSurahs(surahs);

</script>


</body>

    </html>
