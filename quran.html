<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المصحف | أَثَر</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html{
    scroll-behavior:smooth;
}


body{
    font-family:'Cairo',sans-serif;
    background:#edf7f5;
    color:#123f32;
    min-height:100vh;
    padding-bottom:35px;
}


/* =========================
   HEADER
========================= */

.header{

    background:linear-gradient(145deg,#007f78,#00a69a);

    color:white;

    padding:16px 18px 30px;

    border-radius:0 0 42px 42px;

    box-shadow:0 8px 28px rgba(0,80,70,.18);

    position:relative;

    overflow:hidden;

}


.header:before{

    content:"";

    position:absolute;

    width:210px;

    height:210px;

    border:1px solid rgba(255,255,255,.16);

    border-radius:50%;

    top:-125px;

    right:-65px;

}


.header:after{

    content:"";

    position:absolute;

    width:170px;

    height:170px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:50%;

    bottom:-125px;

    left:-70px;

}


.top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:relative;

    z-index:2;

}


.back-btn{

    width:46px;

    height:46px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(255,255,255,.12);

    color:white;

    font-size:22px;

    cursor:pointer;

}


.title{

    text-align:center;

    flex:1;

}


.title h1{

    font-family:'Amiri',serif;

    color:#fffbea;

    font-size:31px;

    font-weight:700;

    line-height:1.2;

}


.title p{

    font-size:10px;

    letter-spacing:4px;

    opacity:.8;

    margin-top:2px;

}


.header-space{

    width:46px;

}


/* =========================
   HERO
========================= */

.hero{

    width:92%;

    max-width:700px;

    margin:-18px auto 20px;

    position:relative;

    z-index:5;

}


.hero-card{

    background:#fffdf7;

    border-radius:28px;

    padding:23px 20px;

    text-align:center;

    box-shadow:0 9px 30px rgba(24,70,60,.10);

    border:1px solid rgba(0,128,115,.08);

}


.ornament{

    color:#b59642;

    font-size:20px;

    letter-spacing:5px;

}


.hero-title{

    font-family:'Amiri',serif;

    font-size:29px;

    color:#087d74;

    margin:5px 0;

}


.hero-text{

    color:#6e766f;

    font-size:13px;

}


.start-reading{

    display:block;

    margin:17px auto 0;

    width:90%;

    max-width:330px;

    padding:13px;

    border:0;

    border-radius:18px;

    background:linear-gradient(135deg,#008f84,#006e67);

    color:white;

    font-family:inherit;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    box-shadow:0 6px 18px rgba(0,120,110,.20);

}


.start-reading:active{

    transform:scale(.98);

}


/* =========================
   CONTAINER
========================= */

.container{

    width:92%;

    max-width:700px;

    margin:0 auto;

}


/* =========================
   SEARCH
========================= */

.search-box{

    background:#fffdf8;

    border-radius:22px;

    padding:7px;

    display:flex;

    align-items:center;

    box-shadow:0 7px 25px rgba(24,55,42,.07);

    margin-bottom:22px;

    border:1px solid #e4eeeb;

}


.search-icon{

    font-size:20px;

    padding:0 10px;

}


.search-box input{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    font-family:inherit;

    font-size:15px;

    color:#123f32;

    padding:12px 5px;

}


.search-box input::placeholder{

    color:#999;

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

}


.section-title h2{

    font-size:23px;

    font-weight:800;

    color:#123f32;

}


.section-title span{

    color:#8a7133;

    font-size:12px;

    background:#fff8df;

    border:1px solid #eadcae;

    padding:5px 11px;

    border-radius:20px;

}


/* =========================
   SURAH LIST
========================= */

.surah-list{

    display:flex;

    flex-direction:column;

    gap:10px;

}


.surah{

    width:100%;

    border:1px solid #dfece8;

    background:#fffefa;

    border-radius:22px;

    padding:13px;

    display:flex;

    align-items:center;

    gap:13px;

    cursor:pointer;

    transition:.2s;

    text-align:right;

    font-family:inherit;

    box-shadow:0 4px 15px rgba(20,70,60,.04);

}


.surah:hover{

    border-color:#b7dcd6;

}


.surah:active{

    transform:scale(.98);

}


.surah-number{

    min-width:45px;

    height:45px;

    border-radius:16px;

    background:#e8f4f1;

    border:1px solid #c9e4df;

    color:#087d74;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:800;

    position:relative;

}


.surah-number:before{

    content:"";

    position:absolute;

    inset:4px;

    border:1px solid #b8dcd6;

    border-radius:12px;

}


.surah-number span{

    position:relative;

    z-index:2;

}


.surah-info{

    flex:1;

}


.surah-name{

    font-family:'Amiri',serif;

    font-size:25px;

    color:#075f58;

    font-weight:700;

    line-height:1.2;

}


.surah-meta{

    font-size:11px;

    color:#8b918d;

    margin-top:4px;

}


.arrow{

    color:#b59642;

    font-size:21px;

    padding-left:3px;

}


/* =========================
   NO RESULT
========================= */

.no-result{

    display:none;

    background:#fffdf8;

    border-radius:24px;

    padding:35px 20px;

    text-align:center;

    color:#777;

    box-shadow:0 6px 20px rgba(0,0,0,.05);

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin:30px 0 10px;

    color:#8b918d;

    font-size:11px;

}


.footer .symbol{

    color:#b59642;

    font-size:17px;

    margin-bottom:4px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .header{

        padding-top:14px;

        border-radius:0 0 36px 36px;

    }


    .title h1{

        font-size:28px;

    }


    .hero{

        width:91%;

    }


    .hero-card{

        padding:20px 15px;

        border-radius:25px;

    }


    .hero-title{

        font-size:27px;

    }


    .hero-text{

        font-size:12px;

    }


    .surah{

        padding:12px;

    }


    .surah-number{

        min-width:42px;

        height:42px;

    }


    .surah-name{

        font-size:23px;

    }


    .surah-meta{

        font-size:10px;

    }

}


@media(max-width:350px){

    .surah-name{

        font-size:21px;

    }


    .surah-number{

        min-width:39px;

        height:39px;

    }


    .section-title h2{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="top">

        <button
            class="back-btn"
            onclick="goHome()">

            →

        </button>


        <div class="title">

            <h1>
                المصحف
            </h1>

            <p>
                ATHAR • HOLY QURAN
            </p>

        </div>


        <div class="header-space"></div>

    </div>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <div class="hero-card">

        <div class="ornament">
            ۞ ✦ ۞
        </div>


        <div class="hero-title">
            كلام الله نورٌ للقلوب
        </div>


        <div class="hero-text">
            اختر سورة وابدأ رحلتك مع القرآن الكريم
        </div>


        <button
            class="start-reading"
            onclick="openSurah(1)">

            📖 ابدأ من سورة الفاتحة

        </button>

    </div>

</section>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <div class="search-icon">
            🔎
        </div>


        <input
            type="text"
            id="searchInput"
            placeholder="ابحث عن اسم السورة..."
            oninput="searchSurahs()">

    </div>



    <!-- TITLE -->

    <div class="section-title">

        <h2>
            سور القرآن الكريم
        </h2>


        <span>
            114 سورة
        </span>

    </div>



    <!-- LIST -->

    <div
        class="surah-list"
        id="surahList">
    </div>



    <!-- NO RESULT -->

    <div
        class="no-result"
        id="noResult">

        🔎

        <br><br>

        لم نجد سورة بهذا الاسم.

    </div>



    <!-- FOOTER -->

    <div class="footer">

        <div class="symbol">
            ✦
        </div>

        <div>
            أَثَر | ATHAR
        </div>

        <div>
            اقرأ، وتدبر، واترك أثرًا طيبًا 🌿
        </div>

    </div>


</main>

/* =========================
   إنشاء القائمة
========================= */

function renderSurahs(list){

    const container =
        document.getElementById("surahList");

    const noResult =
        document.getElementById("noResult");


    container.innerHTML = "";


    if(list.length === 0){

        noResult.style.display = "block";

        return;

    }


    noResult.style.display = "none";


    list.forEach(function(surah){

        const number =
            surahs.indexOf(surah) + 1;


        const button =
            document.createElement("button");


        button.className = "surah";


        button.onclick = function(){

            openSurah(number);

        };


        button.innerHTML = `

            <div class="surah-number">

                <span>
                    ${number}
                </span>

            </div>


            <div class="surah-info">

                <div class="surah-name">
                    ${surah[0]}
                </div>

                <div class="surah-meta">
                    ${surah[1]} آية
                </div>

            </div>


            <div class="arrow">
                ←
            </div>

        `;


        container.appendChild(button);

    });

}


/* =========================
   فتح السورة
========================= */

function openSurah(number){

    window.location.href =
        "surah.html?surah=" +
        number;

}


/* =========================
   البحث
========================= */

function searchSurahs(){

    const input =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        surahs.filter(function(surah){

            return surah[0]
                .toLowerCase()
                .includes(input);

        });


    renderSurahs(filtered);

}


/* =========================
   الرجوع للرئيسية
========================= */

function goHome(){

    window.location.href =
        "index.html";

}


/* =========================
   تشغيل القائمة
========================= */

renderSurahs(surahs);

</script>


</body>

    </html>
