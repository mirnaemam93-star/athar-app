<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#dff5f4;
    color:#172522;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    height:74px;
    background:linear-gradient(135deg,#006f6b,#008b83);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-title{
    text-align:center;
    flex:1;
}

.header-title h1{
    font-size:21px;
    margin-bottom:4px;
    font-weight:bold;
}

.header-title p{
    font-size:11px;
    opacity:.85;
    letter-spacing:.5px;
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.16);
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    padding:20px 12px 105px;
}

/* =========================
   MUSHAF TOP
========================= */

.mushaf-top{
    max-width:720px;
    margin:auto;
    background:#f9f2df;
    border:1px solid rgba(105,82,43,.22);
    border-radius:20px 20px 8px 8px;
    padding:18px 15px 12px;
    box-shadow:0 8px 22px rgba(0,0,0,.10);
    position:relative;
    overflow:hidden;
}

.mushaf-top::before,
.mushaf-top::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    border:1px solid rgba(131,101,48,.22);
    border-radius:50%;
}

.mushaf-top::before{
    right:-42px;
    top:-42px;
}

.mushaf-top::after{
    left:-42px;
    top:-42px;
}

.top-decoration{
    text-align:center;
    color:#8b6a35;
    font-size:19px;
    margin-bottom:7px;
}

.surah-name{
    text-align:center;
    color:#403522;
    font-family:"Amiri",serif;
    font-size:31px;
    font-weight:bold;
}

.juz-name{
    text-align:center;
    color:#80683d;
    font-size:13px;
    margin-top:3px;
}

/* =========================
   READING CARD
========================= */

.reading-shell{
    max-width:720px;
    margin:0 auto;
    background:#f9f2df;
    border-left:1px solid rgba(105,82,43,.18);
    border-right:1px solid rgba(105,82,43,.18);
    box-shadow:0 8px 22px rgba(0,0,0,.08);
    position:relative;
}

/* side label */

.juz-side{
    position:absolute;
    right:-1px;
    top:25px;
    writing-mode:vertical-rl;
    background:#087d77;
    color:white;
    padding:12px 7px;
    border-radius:0 0 0 10px;
    font-size:11px;
    z-index:5;
}

/* =========================
   QURAN CONTENT
========================= */

.quran-content{
    padding:25px 45px 40px;
    direction:rtl;
    text-align:justify;
    font-family:"Amiri",serif;
    font-size:36px;
    line-height:2.35;
    color:#201d18;
    word-spacing:4px;
}

/*
   مهم:
   الآيات أصبحت inline
   وليست كل آية في div منفصل
*/

.ayah{
    display:inline;
}

.ayah-marker{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    margin:0 5px;
    vertical-align:middle;
    border:2px solid #987b45;
    border-radius:50%;
    color:#765d2e;
    font-family:"Amiri",serif;
    font-size:17px;
    line-height:1;
}

/* =========================
   BISMILLAH
========================= */

.bismillah{
    text-align:center;
    font-family:"Amiri",serif;
    font-size:33px;
    color:#453722;
    margin:8px 0 28px;
    line-height:2;
}

/* =========================
   LOADING
========================= */

.loading{
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#52716e;
    font-family:Arial,sans-serif;
}

.loading-icon{
    font-size:52px;
    margin-bottom:18px;
    animation:float 1.5s infinite ease-in-out;
}

.loading-text{
    font-size:16px;
}

.loading-small{
    font-size:12px;
    margin-top:8px;
    opacity:.7;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* =========================
   ERROR
========================= */

.error-box{
    padding:60px 25px;
    text-align:center;
    font-family:Arial,sans-serif;
    color:#67584b;
}

.error-icon{
    font-size:48px;
    margin-bottom:15px;
}

.retry-btn{
    margin-top:20px;
    border:none;
    background:#087d77;
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-size:14px;
    cursor:pointer;
}

/* =========================
   TAJWEED COLORS
========================= */

/* Hamzatul Wasl */
.tj-h{
    color:#8b8b8b;
}

/* Silent */
.tj-s{
    color:#999999;
}

/* Madd normal */
.tj-n{
    color:#537fff;
}

/* Madd permissible */
.tj-p{
    color:#4050ff;
}

/* Madd necessary */
.tj-q{
    color:#000ebc;
}

/* Qalqalah */
.tj-c{
    color:#d50008;
}

/* Madd obligatory */
.tj-o{
    color:#2144c1;
}

/* Ikhfa Shafawi */
.tj-w{
    color:#d500b7;
}

/* Ikhfa */
.tj-f{
    color:#9400a8;
}

/* Idgham Shafawi */
.tj-m{
    color:#58b800;
}

/* Iqlab */
.tj-i{
    color:#26bffd;
}

/* Idgham with ghunnah */
.tj-g{
    color:#169777;
}

/* Idgham without ghunnah */
.tj-l{
    color:#169200;
}

/* Ghunnah */
.tj-u{
    color:#ff7e1e;
}

/* =========================
   FONT CONTROLS
========================= */

.font-controls{

    left:15px;

/* =========================================
   رقم السورة من الرابط
========================================= */

const params = new URLSearchParams(window.location.search);

let surahNumber = parseInt(params.get("surah")) || 1;

if(surahNumber < 1){
    surahNumber = 1;
}

if(surahNumber > 114){

}


/* =========================================
   تحديد الجزء بشكل تقريبي للعنوان
========================================= */

function getJuzText(number){

    if(number <= 2){
        return "الجزء الأول";
    }

    if(number <= 4){
        return "الجزء الثالث";
    }

    if(number <= 6){

    }

    return "المصحف الشريف";
}


/* =========================================
   تحديث العناوين
========================================= */

function updateHeader(){

    const name = surahNames[surahNumber - 1];

    document.title =

    document.getElementById("headerSurah").textContent =

        juz;
}


/* =========================================
   Escape HTML
========================================= */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   تحويل علامات التجويد إلى ألوان
========================================= */

function parseTajweed(text){

    /*
       API الخاص بالتجويد يضع العلامات
       داخل النص.

       مثال تقريبي:
       [h:1[ٱ]

       نقوم بتحويلها إلى span ملون.
    */

    let safe = escapeHtml(text);

    safe = safe.replace(
        /\[([a-z]+)(?::\d+)?\[([^\]]*)\]/gi,
        function(match, tag, content){

            return '<span class="tj-' +
                   tag.toLowerCase() +
                   '">' +
                   content +
                   '</span>';
        }
    );

    /*
       في حالة وجود علامات مختلفة بدون رقم
    */

    safe = safe.replace(
        /\[([a-z]+)\[([^\]]*)\]/gi,
        function(match, tag, content){

            return '<span class="tj-' +
                   tag.toLowerCase() +
                   '">' +
                   content +
                   '</span>';
        }
    );

    /*
       تنظيف أي علامات متبقية
    */

    safe = safe.replace(/\[[a-z]+(?::\d+)?/gi,"");

    safe = safe.replace(/\]/g,"");

    return safe;
}


/* =========================================
   إضافة رقم الآية
========================================= */

function createAyahMarker(number){

    return `
        <span class="ayah-marker">
            ${number}
        </span>
    `;
}


/* =========================================
   جلب القرآن
========================================= */

async function loadSurah(){

    updateHeader();

    const container =
        document.getElementById("quranContent");

    container.innerHTML = `
        <div class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div class="loading-text">
                جاري فتح سورة ${surahNames[surahNumber - 1]}...
            </div>

            <div class="loading-small">
                تجهيز التشكيل وألوان التجويد
            </div>

        </div>
    `;


    const controller = new AbortController();

    const timeout = setTimeout(function(){

        controller.abort();

    },12000);


    try{

        /*
           المحاولة الأولى:
           نسخة التجويد
        */

        let response = await fetch(
            "https://api.alquran.cloud/v1/surah/" +
            surahNumber +
            "/quran-tajweed",
            {
                signal:controller.signal
            }
        );


        if(!response.ok){
            throw new Error("Tajweed API failed");
        }


        let result = await response.json();


        if(
            !result ||
            result.code !== 200 ||
            !result.data ||
            !result.data.ayahs
        ){

            throw new Error("Invalid response");
        }


        renderSurah(
            result.data.ayahs,
            true
        );

    }catch(error){

        console.log(
            "Tajweed failed, trying Uthmani...",
            error
        );


        try{

            /*
               نسخة احتياطية بالتشكيل العثماني
            */

            let response = await fetch(
                "https://api.alquran.cloud/v1/surah/" +
                surahNumber +
                "/quran-uthmani-quran-academy",
                {
                    signal:controller.signal
                }
            );


            if(!response.ok){
                throw new Error("Uthmani API failed");
            }


            let result = await response.json();


            if(
                !result ||
                result.code !== 200 ||
                !result.data ||
                !result.data.ayahs
            ){

                throw new Error("Invalid response");
            }


            renderSurah(
                result.data.ayahs,
                false
            );


        }catch(finalError){

            console.log(finalError);

            container.innerHTML = `

                <div class="error-box">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h3>
                        تعذر فتح السورة
                    </h3>

                    <p style="margin-top:10px;font-size:13px;">
                        تأكد من اتصال الهاتف بالإنترنت
                    </p>

                    <button
                        class="retry-btn"
                        onclick="loadSurah()"
                    >
                        إعادة المحاولة
                    </button>

                </div>

            `;
        }

    }finally{

        clearTimeout(timeout);

    }
}
