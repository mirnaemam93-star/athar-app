<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثر | المصحف الشريف</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
    --green-dark: #0B3D2E;
    --green: #166534;
    --green-light: #D1FAE5;
    --gold: #D4AF37;
    --paper: #FDFBF5;
    --text: #1F2937;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    background: linear-gradient(180deg, var(--green-light) 0%, #F9FAFB 100%);
    color:var(--text);
    font-family: 'Amiri', serif;
    min-height:100vh;
}

/* HEADER */
.header{
    position:sticky;top:0;z-index:1000;height:70px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color:white;display:flex;align-items:center;padding:0 16px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.back{
    width:44px;height:44px;border:0;border-radius:50%;
    background:rgba(255,255,255,.15);color:white;font-size:28px;cursor:pointer;
    transition:.2s;
}
.back:active{transform:scale(.9)}
.header-center{flex:1;text-align:center}
.header-center h1{font-size:20px;font-weight:700}
.header-center p{font-size:11px;opacity:.8;letter-spacing:1px}
.header-space{width:44px}

/* MAIN */
.main{padding:15px 8px 95px}

/* SURAH TITLE */
.surah-box{
    max-width:780px;margin:auto;background:var(--paper);
    border:2px solid var(--gold);border-radius:24px 24px 12px 12px;
    text-align:center;padding:20px;box-shadow:0 10px 30px rgba(11,61,46,.1);
    position:relative;overflow:hidden;
}
.surah-box::before{
    content:"";position:absolute;top:-20px;right:-20px;width:100px;height:100px;
    background:radial-gradient(circle, rgba(212,175,55,.2) 0%, transparent 70%);
}
.ornament{color:var(--gold);font-size:26px;margin-bottom:5px}
.surah-title{font-family:"Scheherazade New",serif;font-size:34px;font-weight:700;color:var(--green-dark)}
.surah-info{font-size:13px;color:#6B7280;margin-top:4px}
