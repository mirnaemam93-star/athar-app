.juz-decoration{
    height:100px;

    margin-top:0;

    align-items:center;
    justify-content:center;

    position:relative;

    overflow:hidden;
}

.juz-decoration::before,
.juz-decoration::after{
    content:"";

    position:absolute;

    top:12px;
    bottom:12px;

    width:70px;

    border:4px solid #e6b6cf;

    background:#079a9b;

    transform:skewX(-18deg);
}

.juz-decoration::before{
    right:20px;
}

.juz-decoration::after{

}

/* =====================================================
   API
===================================================== */

async function fetchSurah(number){

    /*
       نحاول أكثر من نسخة من الـ API
       حتى لو واحدة لم تستجب
    */

    const urls = [

        `https://api.alquran.cloud/v1/surah/${number}/quran-uthmani-quran-academy`,

        `https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`,

        `https://api.alquran.cloud/v1/surah/${number}`

    ];


    let lastError = null;


    for(const url of urls){

        try{

            const controller =
                new AbortController();

            const timeout =
                setTimeout(
                    () => controller.abort(),
                    12000
                );


            const response =
                await fetch(
                    url,
                    {
                        signal:controller.signal
                    }
                );


            clearTimeout(timeout);


            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }


            const json =
                await response.json();


            if(
                json &&
                json.data &&
                json.data.ayahs
            ){

                return json.data;

            }


        }catch(error){

            lastError = error;

        }

    }


    throw lastError ||
        new Error("تعذر تحميل السورة");

}


/* =====================================================
   BUILD SURAH
===================================================== */

function createSurah(data){

    const container =
        document.getElementById("surahContent");


    container.innerHTML = "";


    /* القسم */

    const section =
        document.createElement("section");

    section.className =
        "surah-section";

    section.id =
        "surah-" + data.number;


    /* =================================================
       الزخرفة
    ================================================= */

    const juzWrapper =
        document.createElement("div");

    juzWrapper.className =
        "juz-wrapper";


    const decoration =
        document.createElement("div");

    decoration.className =
        "juz-decoration";


    const center =
        document.createElement("div");

    center.className =
        "juz-center";

    center.innerHTML =
        `
        <div>
            <span>السورة</span>
            <strong>${data.number}</strong>
        </div>
        `;


    const rightNumber =
        document.createElement("div");

    rightNumber.className =
        "juz-side right";

    rightNumber.textContent =
        "ترتيب";


    const leftNumber =
        document.createElement("div");

    leftNumber.className =
        "juz-side left";

    leftNumber.textContent =
        data.number;


    decoration.appendChild(rightNumber);
    decoration.appendChild(center);
    decoration.appendChild(leftNumber);


    juzWrapper.appendChild(decoration);


    const juzLabel =
        document.createElement("div");

    juzLabel.className =
        "juz-label";

    juzLabel.textContent =
        getJuzLabel(data.number);


    juzWrapper.appendChild(juzLabel);


    section.appendChild(juzWrapper);


    /* =================================================
       اسم السورة
    ================================================= */

    const cover =
        document.createElement("div");

    cover.className =
        "surah-cover";


    /*
       البسملة لا تظهر في التوبة
       والفاتحة أصلًا تبدأ بالبسملة
    */

    if(
        data.number !== 9 &&
        data.number !== 1
    ){

        const basmala =
            document.createElement("div");

        basmala.className =
            "basmala";

        basmala.textContent =
            "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";

        cover.appendChild(basmala);

    }


    const surahName =
        document.createElement("div");

    surahName.className =
        "surah-name-large";

    surahName.textContent =
        "سُورَةُ " + data.name.replace("سورة ","");


    cover.appendChild(surahName);


    section.appendChild(cover);


    /* =================================================
       النص
    ================================================= */

    const quranContainer =
        document.createElement("div");

    quranContainer.className =
        "quran-container";


    const quranText =
        document.createElement("div");

    quranText.className =
        "quran-text";


    /*
       لو الفاتحة:
       الآية الأولى هي البسملة بالفعل
    */

    data.ayahs.forEach(

        (ayah, index) => {

            let text =
                ayah.text;


            /*
               في بعض النسخ قد تكون البسملة
               موجودة داخل أول آية.
            */

            if(
                data.number !== 1 &&
                data.number !== 9 &&
                index === 0
            ){

                const basmalaText =
                    "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";

                if(
                    text.startsWith(basmalaText)
                ){

                    text =
                        text.substring(
                            basmalaText.length
                        ).trim();

                }

            }


            const ayahSpan =
                document.createElement("span");

            ayahSpan.className =
                "ayah";

            ayahSpan.dataset.number =
                ayah.numberInSurah;


            ayahSpan.textContent =
                text;


            const numberSpan =
                document.createElement("span");

            numberSpan.className =
                "ayah-number";

            numberSpan.textContent =
                convertToArabicNumber(
                    ayah.numberInSurah
                );


            quranText.appendChild(
                ayahSpan
            );

            quranText.appendChild(
                numberSpan
            );

        }

    );


    quranContainer.appendChild(
        quranText
    );


    section.appendChild(
        quranContainer
    );


    /* =================================================
       نهاية السورة
    ================================================= */

    const end =
        document.createElement("div");

    end.className =
        "next-loader";


    if(data.number < 114){

        end.textContent =
            "اسحب لأعلى لمتابعة السورة التالية 📖";

    }else{

        end.textContent =
            "صدق الله العظيم 🤍";

    }


    section.appendChild(end);


    container.appendChild(section);


    /* تحديث الخط */

    applyFontSize();


    /* مراقبة نهاية السورة */

    setupNextObserver(
        section,
        data.number
    );

}


/* =====================================================
   JUZ LABEL
===================================================== */

function getJuzLabel(number){

    if(number === 1 || number === 2){

        return "الجزء الأول";

    }

    if(number >= 3 && number <= 4){

        return "الجزء الثالث";

    }

    return "المصحف الشريف";

}


/* =====================================================
   ARABIC NUMBERS
===================================================== */

function convertToArabicNumber(number){

    const arabic =
        [
            "٠","١","٢","٣","٤",
            "٥","٦","٧","٨","٩"
        ];


    return String(number)
        .split("")
        .map(
            digit => arabic[
                parseInt(digit)
            ]
