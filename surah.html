<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>أثر | المصحف الشريف</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    background:
        radial-gradient(
            circle at top,
            #dff7f4 0%,
            #c8ebe7 45%,
            #b9dfdb 100%
        );

    color:#29251e;

    font-family:Arial,sans-serif;

    min-height:100vh;

}


/* =====================================
   HEADER
===================================== */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:72px;

    background:
        linear-gradient(
            135deg,
            #006b67,
            #008c84
        );

    color:white;

    display:flex;

    align-items:center;

    padding:0 14px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.18);

}

.back{

    width:44px;

    height:44px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.15);

    color:white;

    font-size:30px;

    cursor:pointer;

}

.header-center{

    flex:1;

    text-align:center;

}

.header-center h1{

    font-size:20px;

    margin-bottom:4px;

}

.header-center p{

    font-size:10px;

    opacity:.85;

    letter-spacing:1px;

}

.header-space{

    width:44px;

}


/* =====================================
   MAIN
===================================== */

.main{

    padding:
        15px
        6px
        95px;

}


/* =====================================
   SURAH TITLE
===================================== */

.surah-box{

    max-width:720px;

    margin:auto;

    background:
        linear-gradient(
            145deg,
            #fbf4e3,
            #f3e8cc
        );

    border:
        1px solid
        rgba(120,90,40,.25);

    border-radius:
        20px
        20px
        8px
        8px;

    text-align:center;

    padding:15px;

    box-shadow:
        0 8px 25px
        rgba(40,70,65,.12);

}

.ornament{

    color:#99763c;

    font-family:"Amiri",serif;

    font-size:23px;

}

.surah-title{

    font-family:"Amiri",serif;

    font-size:31px;

    font-weight:bold;

    color:#493a24;

}

.surah-info{

    font-size:12px;

    color:#816b42;

    margin-top:2px;

}


/* =====================================
   MUSHAF
===================================== */

.mushaf{

    max-width:720px;

    margin:auto;

}


/* =====================================
   PAGE
===================================== */

.quran-page{

    position:relative;

    margin:8px 0;

    padding:
        38px
        43px
        25px;

    min-height:680px;

    background:

        linear-gradient(
            rgba(250,244,228,.97),
            rgba(247,238,215,.97)
        );

    border:
        1px solid
        rgba(126,96,46,.25);

    box-shadow:
        0 8px 24px
        rgba(30,70,65,.12);

    overflow:hidden;

}


/* زخرفة داخل الصفحة */

.quran-page::before{

    content:"";

    position:absolute;

    inset:10px;

    border:
        1px solid
        rgba(139,105,48,.16);

    pointer-events:none;

}

.quran-page::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    border:
        1px solid
        rgba(139,105,48,.12);

    border-radius:50%;

    top:-65px;

    right:-60px;

}


/* =====================================
   PAGE TOP
===================================== */

.page-top{

    position:relative;

    z-index:2;

    text-align:center;

    color:#8d713f;

    font-family:"Amiri",serif;

    font-size:15px;

    margin-bottom:17px;

}


/* =====================================
   QURAN TEXT
===================================== */

.quran-text{

    position:relative;

    z-index:2;

    direction:rtl;

    text-align:justify;

    font-family:"Amiri",serif;

    font-size:31px;

    line-height:2.45;

    color:#211e18;

    word-spacing:2px;

}


/* الآية نفسها */

.ayah{

    display:inline;

}


/* =====================================
   AYAH NUMBER
===================================== */

.ayah-number{

    display:inline-flex;

    justify-content:center;

    align-items:center;

    width:34px;

    height:34px;

    margin:

        0 5px;

    vertical-align:middle;

    border:

        1.7px solid
        #9a7a42;

    border-radius:50%;

    color:#755a2c;

    font-family:"Amiri",serif;

    font-size:15px;

}


/* =====================================
   BISMILLAH
===================================== */

.bismillah{

    position:relative;

    z-index:3;

    text-align:center;

    font-family:"Amiri",serif;

    font-size:29px;

    color:#473923;

    font-weight:bold;

    margin-bottom:25px;

    line-height:2;

}


/* =====================================
   PAGE NUMBER
===================================== */

.page-number{

    position:absolute;

    bottom:13px;

    left:0;

    right:0;

    z-index:5;

    text-align:center;

    color:#80673a;

    font-family:"Amiri",serif;

    font-size:14px;

}


/* =====================================
   JUZ
===================================== */

.juz-label{

    position:absolute;

    right:0;

    top:32px;

    z-index:10;

    writing-mode:vertical-rl;

    background:#087c76;

    color:white;

    padding:
        11px
        6px;

    border-radius:
        0
        0
        0
        9px;

    font-size:9px;

}


/* =====================================
   LOADING
===================================== */

.loading{

    min-height:500px;

    max-width:720px;

    margin:auto;

    background:#f7efdc;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border-radius:15px;

}

.loading-icon{

    font-size:55px;

    margin-bottom:18px;

}

.loading-title{

    font-size:17px;

    color:#4e6d69;

}

.loading-sub{

    margin-top:8px;

    font-size:12px;

    color:#82928f;

}


/* =====================================
   ERROR
===================================== */

.error{

    min-height:450px;

    background:#f7efdc;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:25px;

}

.error-icon{

    font-size:50px;

    margin-bottom:15px;

}

.error p{

    color:#776d61;

    font-size:13px;

    margin-top:8px;

}

.retry{

    border:0;

    margin-top:20px;

    padding:
        12px
        26px;

    border-radius:25px;

    background:#087c76;

    color:white;

}


/* =====================================
   FONT BUTTONS
===================================== */

.font-controls{

    position:fixed;

    left:10px;

    bottom:80px;

    z-index:900;

    display:flex;

    flex-direction:column;

    gap:8px;

}

.font-btn{

    width:42px;

    height:42px;

    border:0;

    border-radius:50%;

    background:#087c76;

    color:white;

    font-size:21px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.2);

}


/* =====================================
   BOTTOM NAV
===================================== */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:68px;

    background:white;

    z-index:1000;

    display:flex;

    justify-content:space-around;

    align-items:center;

    box-shadow:
        0 -4px 18px
        rgba(0,0,0,.1);

    border-top:
        1px solid
        rgba(0,0,0,.07);

}

.nav-btn{

    border:0;

    background:none;

    min-width:80px;

    color:#687876;

    font-size:12px;

}

.nav-btn span{

    display:block;

    font-size:24px;

    margin-bottom:2px;

}

.nav-btn.active{

    color:#087c76;

    font-weight:bold;

}


/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

    .main{

        padding:
            10px
            3px
            92px;

    }

    .quran-page{

        padding:
            30px
            27px
            28px;

        min-height:650px;

        border-radius:5px;

    }

    .quran-text{

        font-size:28px;

        line-height:2.48;

    }

    .bismillah{

        font-size:27px;

    }

    .ayah-number{

        width:31px;

        height:31px;

        font-size:14px;

        margin:
            0
            4px;

    }

    .surah-title{

        font-size:28px;

    }

}


/* =====================================
   SMALL PHONES
===================================== */

@media(max-width:380px){

    .quran-page{

        padding:
            27px
            21px
            27px;

    }

    .quran-text{

        font-size:26px;

        line-height:2.5;

    }

    .bismillah{

        font-size:25px;

    }

}

</style>

</head>


<body>


<!-- ===============================
     HEADER
================================ -->

<header class="header">

    <button
        class="back"
        onclick="goQuran()">

        ‹

    </button>


    <div class="header-center">

        <h1 id="headerTitle">
            سورة الفاتحة
        </h1>

        <p>
            ATHAR • المصحف الشريف
        </p>

    </div>


    <div class="header-space"></div>

</header>



<!-- ===============================
     MAIN
================================ -->

<main class="main">


    <section class="surah-box">

        <div class="ornament">
            ۞
        </div>

        <div
            class="surah-title"
            id="surahTitle">

            سورة الفاتحة

        </div>

        <div
            class="surah-info"
            id="surahInfo">

            جاري تحميل السورة...

        </div>

    </section>


    <section
        class="mushaf"
        id="mushaf">

        <div class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div class="loading-title">
                جاري فتح المصحف...
            </div>

            <div class="loading-sub">
                لحظات ويتم عرض السورة
            </div>

        </div>

    </section>


</main>



<!-- ===============================
     FONT CONTROLS
================================ -->

<div class="font-controls">

    <button
        class="font-btn"
        onclick="increaseFont()">

        +

    </button>


    <button
        class="font-btn"
        onclick="decreaseFont()">

        −

    </button>

</div>



<!-- ===============================
     BOTTOM NAV
================================ -->

<nav class="bottom-nav">

    <button
        class="nav-btn"
        onclick="previousSurah()">

        <span>‹</span>

        السابق

    </button>


    <button
        class="nav-btn active"
        onclick="goQuran()">

        <span>📖</span>

        القرآن

    </button>


    <button
        class="nav-btn"
        onclick="nextSurah()">

        <span>›</span>

        التالي

    </button>

</nav>



<script>

/* =====================================================
   أسماء السور
===================================================== */

const surahNames = [

"الفاتحة",
"البقرة",
"آل عمران",
"النساء",
"المائدة",
"الأنعام",
"الأعراف",
"الأنفال",

"الحج",
"المؤمنون",
"النور",
"الفرقان",

"النمل",

"العنكبوت",

"الشورى",

"الدخان",
"الجاثية",
"الأحقاف",
"محمد",
"الفتح",
"الحجرات",
"ق",
"الذاريات",
"الطور",
"النجم",
"القمر",
"الرحمن",
"الواقعة",
"الحديد",
"المجادلة",
"الحشر",
"الممتحنة",
"الصف",
"الجمعة",
"المنافقون",
"التغابن",
"الطلاق",
"التحريم",
"الملك",
"القلم",
"الحاقة",
"المعارج",
"نوح",
"الجن",
"المزمل",
"المدثر",
"القيامة",
"الإنسان",
"المرسلات",
"النبأ",
"النازعات",
"عبس",
"التكوير",
"الانفطار",
"المطففين",
"الانشقاق",
"البروج",
"الطارق",
"الأعلى",
"الغاشية",
"الفجر",
"البلد",
"الشمس",
"الليل",
"الضحى",
"الشرح",
"التين",
"العلق",
"القدر",
"البينة",
"الزلزلة",
"العاديات",
"القارعة",
"التكاثر",
"العصر",
"الهمزة",
"الفيل",
"قريش",
"الماعون",
"الكوثر",
"الكافرون",
"النصر",
"المسد",
"الإخلاص",
"الفلق",
"الناس"

];


/* =====================================================
   رقم السورة
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let surahNumber =
    parseInt(
        params.get("surah")
    ) || 1;


if(surahNumber < 1){

    surahNumber = 1;

}


if(surahNumber > 114){

    surahNumber = 114;

}


const surahName =
    surahNames[surahNumber - 1];


/* =====================================================
   تحديث العنوان
===================================================== */

function updateHeader(){

    document.title =
        "أثر | سورة " +
        surahName;


    document.getElementById(
        "headerTitle"
    ).textContent =
        "سورة " +
        surahName;


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " +
        surahName;

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   إنشاء آية
===================================================== */

function makeAyah(ayah){

    const text =
        escapeHTML(
            ayah.text || ""
        );


    return `

        <span class="ayah">

            ${text}

            <span class="ayah-number">

                ${ayah.numberInSurah}

            </span>

        </span>

    `;

}


/* =====================================================
   جلب السورة
===================================================== */

async function loadSurah(){

    const mushaf =
        document.getElementById(
            "mushaf"
        );


    mushaf.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div class="loading-title">
                جاري تحميل سورة ${surahName}...
            </div>

            <div class="loading-sub">
                يتم تجهيز صفحات المصحف
            </div>

        </div>

    `;


    /*
       هذا هو الطلب الأساسي فقط.

       لا يوجد انتظار لطلب تجويد
       أو طلب ثاني قبل عرض القرآن.
    */

    try{

        const response =
            await fetch(
                "https://api.alquran.cloud/v1/surah/" +
                surahNumber
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if(
            !result ||
            result.code !== 200 ||
            !result.data ||
            !Array.isArray(
                result.data.ayahs
            )
        ){

            throw new Error(
                "بيانات غير صحيحة"
            );

        }


        const ayahs =
            result.data.ayahs;


        /*
           معلومات السورة
        */

        document.getElementById(
            "surahInfo"
        ).textContent =

            result.data.numberOfAyahs +
            " آيات • " +
            (
                result.data.revelationType ===
                "Meccan"
                ?
                "مكية"
                :
                "مدنية"
            );


        /*
           عرض الصفحات فورًا
        */

        renderPages(
            ayahs
        );


    }catch(error){

        console.error(
            "Quran Error:",
            error
        );


        showError();

    }

}


/* =====================================================
   تقسيم السورة إلى صفحات
===================================================== */

function renderPages(ayahs){

    const mushaf =
        document.getElementById(
            "mushaf"
        );


    mushaf.innerHTML = "";


    /*
       نجمع الآيات حسب رقم صفحة المصحف.
    */

    const pages = {};


    ayahs.forEach(
        function(ayah){

            /*
               الـ API يعطي page
               لكل آية.

               وإذا لم تكن موجودة،
               نستخدم صفحة مؤقتة.
            */

            const page =
                ayah.page ||
                1;


            if(!pages[page]){

                pages[page] = [];

            }


            pages[page].push(
                ayah
            );

        }
    );


    const pageNumbers =
        Object.keys(pages)
        .sort(
            function(a,b){

                return Number(a) -
                       Number(b);

            }
        );


    /*
       إنشاء كل صفحة
    */

    pageNumbers.forEach(
        function(pageNumber,index){

            const page =
                document.createElement(
                    "article"
                );


            page.className =
                "quran-page";


            /*
               الجزء
            */

            const juz =
                document.createElement(
                    "div"
                );


            juz.className =
                "juz-label";


            if(
                pages[pageNumber][0].juz
            ){

                juz.textContent =
                    "الجزء " +
                    pages[pageNumber][0].juz;

            }else{

                juz.textContent =
                    "المصحف";

            }


            page.appendChild(
                juz
            );


            /*
               أعلى الصفحة
            */

            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "page-top";


            top.textContent =
                "۞  " +
                surahName +
                "  ۞";


            page.appendChild(
                top
            );


            /*
               محتوى القرآن
            */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "quran-text";


            /*
               البسملة في بداية السورة
            */

            if(
                index === 0 &&
                surahNumber !== 9
            ){

                const bismillah =
                    document.createElement(
                        "div"
                    );


                bismillah.className =
                    "bismillah";


                bismillah.textContent =
                    "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ";


                content.appendChild(
                    bismillah
                );

            }


            /*
               الآيات
            */

            pages[pageNumber].forEach(
                function(ayah){

                    content.insertAdjacentHTML(
                        "beforeend",
                        makeAyah(ayah)
                    );

                }
            );


            page.appendChild(
                content
            );


            /*
               رقم الصفحة
            */

            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "page-number";


            number.textContent =
                "صفحة " +
                pageNumber;


            page.appendChild(
