<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #dff1f2;
    color: #111;
    font-family: "Cairo", sans-serif;
    padding-bottom: 70px;
}


/* ================================
   HEADER
================================ */

.header {

    position: sticky;
    top: 0;
    z-index: 5000;

    height: 74px;

    background:
        linear-gradient(
            135deg,
            #007f76,
            #009d92
        );

    color: white;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);
}

.header-inner {

    height: 100%;
    max-width: 760px;

    margin: auto;

    display: flex;
    align-items: center;

    padding: 0 14px;
}

.back-button {

    width: 45px;
    height: 45px;

    border: 1px solid rgba(255,255,255,.20);

    border-radius: 50%;

    background:
        rgba(255,255,255,.10);

    color: white;

    font-size: 31px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    line-height: 1;
}

.back-button:active {
    transform: scale(.92);
}

.header-title {

    flex: 1;

    text-align: center;
}

.header-title h1 {

    font-family:
        "Amiri Quran",
        serif;

    font-size: 27px;

    font-weight: 400;

    line-height: 1.1;
}

.header-title p {

    margin-top: 3px;

    font-size: 8px;

    letter-spacing: 3px;

    opacity: .72;
}

.header-space {
    width: 45px;
}


/* ================================
   PAGE
================================ */

.page {

    width: 100%;
    max-width: 760px;

    margin: auto;
}


/* ================================
   SURAH
================================ */

.surah {

    width: 100%;

    animation:
        appear .45s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ================================
   SURAH HEADER
================================ */

.surah-header {

    position: relative;

    height: 125px;

    margin: 9px 6px 0;

    overflow: hidden;

    border:
        5px solid #008b83;

    border-radius:
        8px 8px 0 0;

    background:

        linear-gradient(
            135deg,
            #bde0df,
            #f3e8b5,
            #c5e4e2
        );
}

.surah-header::before {

    content: "";

    position: absolute;

    inset: 8px;

    border:
        2px solid #078b83;

    background:

        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,.22) 0,
            rgba(255,255,255,.22) 7px,
            transparent 7px,
            transparent 15px
        );
}


/* ================================
   DOTS
================================ */

.dot {

    position: absolute;

    z-index: 5;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: #e75b91;

    top: 45px;

    box-shadow:
        0 0 0 4px rgba(255,255,255,.15);
}

.dot-right {
    right: 52px;
}

.dot-left {
    left: 52px;
}


/* ================================
   CENTER CIRCLE
================================ */

.surah-center {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 103px;
    height: 103px;

    border-radius: 50%;

    background: #f8eab1;

    border:
        5px solid #008b83;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    box-shadow:
        0 5px 14px rgba(0,0,0,.15);
}

.surah-center::after {

    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid rgba(128,101,25,.50);

    border-radius: 50%;
}

.surah-center strong {

    position: relative;
    z-index: 2;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 19px;

    font-weight: 400;

    line-height: 1.4;
}

.surah-center span {

    position: relative;
    z-index: 2;

    font-size: 9px;

    margin-top: 2px;
}


/* ================================
   INFO
================================ */

.surah-info {

    position: absolute;

    z-index: 10;

    top: 50%;

    transform:
        translateY(-50%);

    text-align: center;

    color: #111;
}

.surah-info.right {
    right: 12px;
}

.surah-info.left {
    left: 12px;
}

.surah-info strong {

    display: block;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 18px;

    font-weight: 400;
}

.surah-info span {

    display: block;

    font-size: 14px;

    margin-top: 2px;
}


/* ================================
   QURAN PAPER
================================ */

.quran-paper {

    background:
        linear-gradient(
            180deg,
            #e3f3f4,
            #dff1f2
        );

    padding:
        35px
        20px
        50px;
}


/* ================================
   BISMILLAH
================================ */

.bismillah {

    text-align: center;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 38px;

    line-height: 2;

    margin-bottom: 25px;
}


/* ================================
   QURAN TEXT
================================ */

.quran-text {

    direction: rtl;

    text-align: right;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 31px;

    line-height: 2.45;

    word-spacing: 2px;

    color: #080808;
}


/* ================================
   AYAH
================================ */

.ayah {
    display: inline;
}


/* ================================
   AYAH NUMBER
================================ */

.ayah-number {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    vertical-align: middle;

    width: 39px;
    height: 39px;

    margin:
        0 5px;

    border:
        2px solid #222;

    border-radius: 50%;

    font-family:
        "Cairo",
        sans-serif;

    font-size: 13px;

    line-height: 1;

    background:
        rgba(255,255,255,.15);
}


/* ================================
   SURAH END
================================ */

.surah-end {

    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:

        linear-gradient(
            90deg,
            #007f76,
            #009f94,
            #007f76
        );

    color: #f5e5aa;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 18px;
}

.surah-end::before,
.surah-end::after {

    content: "◆";

    margin:
        0 12px;

    font-size: 8px;
}


/* ================================
   LOADING
================================ */

.loading {

    min-height: 360px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 14px;

    color: #506f6d;

    text-align: center;
}

.loading-icon {

    font-size: 48px;

    animation:
        bookPulse 1.3s infinite;
}

@keyframes bookPulse {

    0%,100% {
        transform: scale(1);
        opacity: .55;
    }

    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}


/* ================================
   ERROR
================================ */

.error {

    display: none;

    min-height: 360px;

    padding: 70px 20px;

    text-align: center;

    color: #50615f;
}

.error-icon {

    font-size: 50px;

    margin-bottom: 15px;
}

.retry-button {

    margin-top: 20px;

    padding:
        11px 25px;

    border: 0;

    border-radius: 30px;

    background: #008f86;

    color: white;

    font-family: Cairo, sans-serif;

    font-size: 14px;

    cursor: pointer;
}


/* ================================
   NEXT LOADER
================================ */

.next-loader {

    min-height: 120px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 8px;

    color: #537572;

    font-size: 13px;
}

.next-icon {

    font-size: 28px;

    animation:
        bookPulse 1.3s infinite;
}


/* ================================
   END
================================ */

.end-quran {

    min-height: 190px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 10px;

    text-align: center;

    color: #52716f;
}

.end-quran-icon {
    font-size: 45px;
}


/* ================================
   FONT BUTTONS
================================ */

.font-controls {

    position: fixed;

    left: 11px;

    bottom: 80px;

    z-index: 4500;

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.font-btn {

    width: 47px;
    height: 47px;

    border-radius: 50%;

    border:
        1px solid rgba(0,130,120,.15);

    background: #fffdf7;

    color: #00877e;

    font-size: 22px;

    font-weight: 800;

    box-shadow:
        0 5px 17px rgba(0,0,0,.16);

    cursor: pointer;
}

.font-btn:active {
    transform: scale(.93);
}


/* ================================
   BOTTOM NAV
================================ */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 68px;

    z-index: 6000;

    display: flex;

    background:

        linear-gradient(
            90deg,
            #008b82,
            #009c91,
            #008b82
        );

    box-shadow:
        0 -4px 15px rgba(0,0,0,.17);
}

.bottom-btn {

    flex: 1;

    border: 0;

    background: transparent;

    color: white;

    font-family:
        Cairo,
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}

.bottom-btn:active {
    background: rgba(255,255,255,.12);
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px) {

    body {
        padding-bottom: 63px;
    }

    .header {
        height: 72px;
    }

    .header-title h1 {
        font-size: 25px;
    }

    .header-title p {
        font-size: 7px;
    }

    .surah-header {

        height: 112px;

        margin:
            7px 5px 0;
    }

    .surah-center {

        width: 91px;
        height: 91px;
    }

    .surah-center strong {
        font-size: 17px;
    }

    .dot {

        width: 22px;
        height: 22px;

        top: 40px;
    }

    .dot-right {
        right: 40px;
    }

    .dot-left {
        left: 40px;
    }

    .surah-info.right {
        right: 7px;
    }

    .surah-info.left {
        left: 7px;
    }

    .surah-info strong {
        font-size: 15px;
    }

    .surah-info span {
        font-size: 11px;
    }

    .quran-paper {

        padding:
            27px
            12px
            48px;
    }

    .bismillah {

        font-size: 32px;

        margin-bottom: 21px;
    }

    .quran-text {

        font-size: 28px;

        line-height: 2.42;

        word-spacing: 1px;
    }

    .ayah-number {

        width: 35px;
        height: 35px;

        font-size: 12px;

        margin:
            0 4px;
    }

    .font-controls {

        left: 9px;

        bottom: 74px;
    }

    .font-btn {

        width: 44px;
        height: 44px;
    }

    .bottom-nav {
        height: 62px;
    }

    .bottom-btn {
        font-size: 13px;
    }
}


/* ================================
   SMALL PHONES
================================ */

@media(max-width:350px) {

    .quran-text {

        font-size: 24px;

        line-height: 2.48;
    }

    .bismillah {
        font-size: 28px;
    }

    .surah-center {
        width: 80px;
        height: 80px;
    }

    .surah-center strong {
        font-size: 14px;
    }

    .surah-info strong {
        font-size: 13px;
    }

    .surah-info span {
        font-size: 10px;
    }
}

</style>

</head>

    <button
        class="bottom-btn"

        onclick="nextSurah()">

        التالي

</nav>

/* =====================================================
   GET START SURAH
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let startSurah =
    parseInt(
        params.get("surah")
    ) || 1;


if(startSurah < 1) {
    startSurah = 1;
}

if(startSurah > 114) {
    startSurah = 114;
}


/* =====================================================
   VARIABLES
===================================================== */

let currentSurah =
    startSurah;

let fontSize =
    31;

let loading =
    false;

let loaded =
    new Set();

let observer =
    null;


/* =====================================================
   LOAD FONT
===================================================== */

try {

    const saved =
        parseInt(
            localStorage.getItem(
                "athar-quran-font"
            )
        );

    if(
        saved >= 22 &&
        saved <= 42
    ) {

        fontSize =
            saved;
    }

}
catch(error) {}


/* =====================================================
   API FETCH WITH TIMEOUT
===================================================== */

async function getSurah(number) {

    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            function() {

                controller.abort();

            },
            10000
        );


    try {

        const response =
            await fetch(

                "https://api.alquran.cloud/v1/surah/" +
                number +
                "/quran-uthmani",

                {
                    method: "GET",

                    cache: "no-store",

                    signal:
                        controller.signal
                }

            );


        clearTimeout(timeout);


        if(!response.ok) {

            throw new Error(
                "API_ERROR"
            );

        }


        const result =
            await response.json();


        if(
            !result ||
            !result.data ||
            !result.data.ayahs
        ) {

            throw new Error(
                "DATA_ERROR"
            );

        }


        return result.data;

    }

    catch(error) {

        clearTimeout(timeout);

        throw error;

    }

}


/* =====================================================
   LOAD SURAH
===================================================== */

async function loadSurah(number, scrollTo = false) {

    if(
        number < 1 ||
        number > 114
    ) {

        return false;

    }


    if(
        loaded.has(number)
    ) {

        if(scrollTo) {

            scrollToSurah(
                number
            );

        }

        return true;

    }


    if(loading) {
        return false;
    }


    loading = true;


    if(number === startSurah) {

        showLoading(
            "جاري فتح سورة " +
            surahNames[number - 1] +
            "..."
        );

    }


    try {

        const surah =
            await getSurah(
                number
            );


        createSurah(
            surah
        );


        loaded.add(
            number
        );


        hideLoading();


        hideError();


        updateHeader();

        updateButtons();


        if(scrollTo) {

            setTimeout(
                function() {

                    scrollToSurah(
                        number
                    );

                },
                150
            );

        }


        loading = false;


        if(number < 114) {

            createNextLoader();

        }
        else {

            createEnd();

        }


        return true;

    }

    catch(error) {

        console.error(
            error
        );


        loading = false;


        hideLoading();


        showError();

        return false;

    }

}


/* =====================================================
   CREATE SURAH
===================================================== */

function createSurah(surah) {

    const page =
        document.getElementById(
            "quranPage"
        );


    const section =
        docum
