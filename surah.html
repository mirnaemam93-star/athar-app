<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#008f86">

<title>المصحف | أَثَر</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700;800&display=swap"

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #dff1f2;
    color: #111;
    font-family: "Cairo", sans-serif;
    padding-bottom: 72px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: sticky;
    top: 0;
    z-index: 5000;

    height: 74px;

    background:
        linear-gradient(
            135deg,
            #007a72,
            #009e93
        );

    color: white;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);
}

.header-inner {

    width: 100%;
    max-width: 850px;
    height: 100%;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;
}

.menu-button {

    width: 44px;
    height: 44px;

    border: 1px solid rgba(255,255,255,.20);
    border-radius: 50%;

    background: rgba(255,255,255,.10);

    color: white;

    font-size: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.menu-button:active {
    transform: scale(.94);
}

.header-space {
    width: 44px;
}

.header-title {
    flex: 1;
    text-align: center;
}

.header-title h1 {

    font-family: "Amiri Quran", serif;

    font-size: 27px;
    font-weight: 400;

    line-height: 1.1;
}

.header-title p {

    margin-top: 3px;

    font-size: 8px;

    letter-spacing: 3px;

    opacity: .72;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width: 100%;
    max-width: 760px;

    margin: auto;
}


/* =========================================================
   SURAH
========================================================= */

.surah {

    width: 100%;

    animation:
        surahAppear .5s ease;
}

@keyframes surahAppear {

    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   SURAH HEADER
========================================================= */

.surah-header {

    position: relative;

    height: 128px;

    margin: 10px 7px 0;

    overflow: hidden;

    border-radius:
        8px 8px 0 0;

    border:
        5px solid #008b83;

    background:

        linear-gradient(
            135deg,
            #b9dedc,
            #f4e8b5,
            #c4e3e1
        );
}


/* زخرفة داخلية */

.surah-header::before {

    content: "";

    position: absolute;

    inset: 8px;

    border:
        2px solid #078b83;

    background:

        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,.20) 0,
            rgba(255,255,255,.20) 7px,
            transparent 7px,
            transparent 15px
        );
}


/* =========================================================
   DECORATIVE CIRCLES
========================================================= */

.dot {

    position: absolute;

    z-index: 5;

    width: 24px;
    height: 24px;

    border-radius: 50%;

    background: #e75b91;

    box-shadow:
        0 0 0 4px rgba(255,255,255,.18);
}

.dot-right {
    right: 52px;
    top: 48px;
}

.dot-left {
    left: 52px;
    top: 48px;
}


/* =========================================================
   SURAH CENTER
========================================================= */

.surah-center {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #f8eab1;

    border:
        5px solid #008b83;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.15);
}

.surah-center::after {

    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid rgba(128,101,25,.55);

    border-radius: 50%;
}

.surah-center strong {

    position: relative;
    z-index: 2;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 19px;

    font-weight: 400;

    line-height: 1.35;
}

.surah-center span {

    position: relative;
    z-index: 2;

    margin-top: 3px;

    font-size: 9px;

    opacity: .85;
}


/* =========================================================
   SURAH INFO
========================================================= */

.surah-info {

    position: absolute;

    z-index: 10;

    top: 50%;

    transform:
        translateY(-50%);

    text-align: center;

    color: #111;
}

.surah-info.right {
    right: 13px;
}

.surah-info.left {
    left: 13px;
}

.surah-info strong {

    display: block;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 18px;

    font-weight: 400;
}

.surah-info span {

    display: block;

    font-size: 14px;

    margin-top: 2px;
}


/* =========================================================
   QURAN PAPER
========================================================= */

.quran-paper {

    position: relative;

    background:

        linear-gradient(
            180deg,
            #e3f3f4,
            #dff1f2
        );

    padding:
        34px
        20px
        50px;
}


/* خط زخرفي */

.quran-paper::before {

    content: "";

    position: absolute;

    top: 0;

    right: 12px;
    left: 12px;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,128,120,.30),
            transparent
        );
}


/* =========================================================
   BISMILLAH
========================================================= */

.bismillah {

    text-align: center;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 38px;

    line-height: 2;

    margin-bottom: 25px;

    color: #111;
}


/* =========================================================
   QURAN TEXT
========================================================= */

.quran-text {

    direction: rtl;

    text-align: right;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 31px;

    line-height: 2.45;

    word-spacing: 2px;

    color: #080808;
}


/* =========================================================
   AYAH
========================================================= */

.ayah {

    display: inline;
}


/* =========================================================
   AYAH NUMBER
========================================================= */

.ayah-number {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    vertical-align: middle;

    width: 39px;
    height: 39px;

    margin:
        0 5px;

    border:
        2px solid #222;

    border-radius: 50%;

    font-family:
        "Cairo",
        sans-serif;

    font-size: 13px;

    font-weight: 600;

    line-height: 1;

    color: #111;

    background:
        rgba(255,255,255,.15);
}


/* =========================================================
   SURAH END
========================================================= */

.surah-end {

    min-height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    background:

        linear-gradient(
            90deg,
            #007e76,
            #009f94,
            #007e76
        );

    color: #f5e5aa;

    font-family:
        "Amiri Quran",
        serif;

    font-size: 18px;
}

.surah-end::before,
.surah-end::after {

    content: "◆";

    font-size: 9px;

    opacity: .8;
}


/* =========================================================
   NEXT LOADING AREA
========================================================= */

.next-loader {

    min-height: 115px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 7px;

    color: #537572;

    font-size: 13px;
}

.next-loader-icon {

    font-size: 26px;

    animation:
        pulseBook 1.4s infinite;
}

@keyframes pulseBook {

    0%,100% {
        transform: scale(1);
        opacity: .55;
    }

    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}


/* =========================================================
   LAST SURAH
========================================================= */

.end-of-quran {

    min-height: 180px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 10px;

    text-align: center;

    color: #52716f;
}

.end-of-quran-icon {
    font-size: 45px;
}


/* =========================================================
   INITIAL LOADING
========================================================= */

.loading {

    min-height: 280px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 12px;

    color: #50716e;
}

.loading-icon {

    font-size: 45px;

    animation:
        pulseBook 1.4s infinite;
}


/* =========================================================
   ERROR
========================================================= */

.error {

    display: none;

    text-align: center;

    padding: 70px 20px;

    color: #50615f;
}

.error-icon {

    font-size: 45px;

    margin-bottom: 14px;
}

.error button {

    margin-top: 18px;

    padding:
        10px
        22px;

    border: 0;

    border-radius: 25px;

    background: #008f86;

    color: white;

    font-family: Cairo, sans-serif;

    cursor: pointer;
}


/* =========================================================
   FONT CONTROLS
========================================================= */

.font-controls {

    position: fixed;

    left: 12px;

    bottom: 82px;

    z-index: 4500;

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.font-btn {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(0,130,120,.16);

    background: #fffdf7;

    color: #00877e;

    font-size: 22px;

    font-weight: 800;

    box-shadow:
        0 5px 17px rgba(0,0,0,.16);

    cursor: pointer;
}

.font-btn:active {

    transform: scale(.93);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 68px;

    z-index: 6000;

    display: flex;

    background:
        linear-gradient(
            90deg,
            #008b82,
            #009c91,
            #008b82
        );

    box-shadow:
        0 -4px 16px rgba(0,0,0,.17);
}

.bottom-btn {

    flex: 1;

    border: 0;

    background: transparent;

    color: white;

    font-family:
        "Cairo",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.bottom-btn:active {

    background:
        rgba(255,255,255,.12);
}

.bottom-btn.disabled {

    opacity: .45;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px) {

    body {
        padding-bottom: 63px;
    }

    .header {
        height: 72px;
    }

    .header-title h1 {
        font-size: 25px;
    }

    .header-title p {
        font-size: 7px;
    }

    .surah-header {

        height: 112px;

        margin:
            7px
            5px
            0;
    }

    .surah-center {

        width: 91px;
        height: 91px;
    }

    .surah-center strong {
        font-size: 17px;
    }

    .dot {

        width: 22px;
        height: 22px;

        top: 40px;
    }

    .dot-right {
        right: 40px;
    }

    .dot-left {
        left: 40px;
    }

    .surah-info.right {
        right: 7px;
    }

    .surah-info.left {
        left: 7px;
    }

    .surah-info strong {
        font-size: 15px;
    }

    .surah-info span {
        font-size: 11px;
    }

    .quran-paper {

        padding:
            27px
            12px
            48px;
    }

    .bismillah {

        font-size: 32px;

        margin-bottom: 21px;
    }

    .quran-text {

        font-size: 28px;

        line-height: 2.42;

        word-spacing: 1px;
    }

    .ayah-number {

        width: 35px;
        height: 35px;

        font-size: 12px;

        margin:
            0 4px;
    }

    .font-controls {

        left: 9px;

        bottom: 75px;
    }

    .font-btn {

        width: 44px;
        height: 44px;
    }

    .bottom-nav {
        height: 62px;
    }

    .bottom-btn {
        font-size: 13px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:350px) {

    .quran-text {

        font-size: 24px;

        line-height: 2.48;
    }

    .bismillah {
        font-size: 28px;
    }

    .surah-center {

        width: 80px;
        height: 80px;
    }

    .surah-center strong {
        font-size: 14px;
    }

    .surah-info strong {
        font-size: 13px;
    }

    .surah-info span {
        font-size: 10px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    .surah,
    .loading-icon,
    .next-loader-icon {
        animation: none;
    }
}

</style>

</head>


<body>

     HEADER
========================================================= -->

    <div class="header-inner">

        <button
            class="menu-button"
            onclick="goBack()"
            aria-label="رجوع">

        <div class="header-title">

            <h1 id="currentHeader">
                سورة الفاتحة
            </h1>

            <p>
                ATHAR • المصحف الشريف
            </p>

        </div>


        <div class="header-space"></div>

    </div>

</header>


<!-- =========================================================
     QURAN CONTENT
========================================================= -->

<main
    class="page"
    id="quranPage">
</main>


<!-- =========================================================

========================================================= -->

<div
    class="loading"
    id="loading">

</div>


<!-- =========================================================

========================================================= -->

<div class="font-controls">

        class="font-btn"

        aria-label="تكبير الخط">

        class="font-btn"

<!-- =========================================================

========================================================= -->

<nav class="bottom-nav">

        onclick="goBack()">

        القرآن

    </button>


    <button
        class="bottom-btn"
        id="nextButton"
        onclick="nextSurah()">

        التالي

    </button>

</nav>

/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

let startSurah =
    parseInt(
        params.get("surah")
    ) || 1;


/* حماية الرقم */

if(startSurah < 1) {
    startSurah = 1;
}

if(startSurah > 114) {
    startSurah = 114;
}


/* =========================================================
   VARIABLES
========================================================= */

let fontSize = 31;

const loaded =
    new Set();

let loadingSurah =
    false;

let loadingNext =
    false;

let observer = null;


/* =========================================================
   LOAD SURAH
========================================================= */

async function loadSurah(number, scrollToIt = false) {

    if(
        number < 1 ||
        number > 114
    ) {
        return null;
    }


    if(
        loaded.has(number)
    ) {

        if(scrollToIt) {
            scrollToSurah(number);
        }

        return;
    }


    if(loadingSurah && number === startSurah) {
        return;
    }


    if(number !== startSurah) {
        loadingNext = true;
    } else {
        loadingSurah = true;
    }


    try {

        const response =
            await fetch(

                "https://api.alquran.cloud/v1/surah/" +
