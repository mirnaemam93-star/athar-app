<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta charset="UTF-8">

<meta name="viewport"

<style>

/* ==================================================
   FONTS
================================================== */

@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700;800&display=swap');


/* ==================================================
   RESET
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#dff1f2;
    color:#111;
    font-family:'Cairo',sans-serif;
    padding-bottom:72px;
}


/* ==================================================
   HEADER
================================================== */

.header{

    position:sticky;
    top:0;
    z-index:1000;

    height:78px;

    background:
        linear-gradient(
            135deg,
            #007f76,
            #009c91
        );

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);

    color:white;
}

.header-inner{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;
}

.menu-button{

    width:46px;
    height:46px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    line-height:1;

    color:white;

    cursor:pointer;

    background:rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    transition:.2s;
}

.menu-button:active{
    transform:scale(.92);
}

.header-title{

    flex:1;

    text-align:center;
}

.header-title h1{

    font-family:'Amiri Quran',serif;

    font-size:29px;

    line-height:1.2;

    font-weight:400;
}

.header-title p{

    margin-top:2px;

    font-size:9px;

    letter-spacing:3px;

    opacity:.72;
}

.header-space{
    width:46px;
}


/* ==================================================
   PAGE
================================================== */

.page{

    width:100%;

    max-width:760px;

    margin:auto;
}


/* ==================================================
   SURAH
================================================== */

.surah{

    width:100%;

    animation:
        fadeIn .45s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* ==================================================
   SURAH HEADER
================================================== */

.surah-header{

    position:relative;

    margin:10px 8px 0;

    height:125px;

    overflow:hidden;

    border-radius:
        8px 8px 0 0;

    background:
        linear-gradient(
            135deg,
            #bde0df,
            #f3e8b5,
            #c4e4e2
        );

    border:
        5px solid
        #008b83;
}


/* ==================================================
   INNER FRAME
================================================== */

.surah-header::before{

    content:"";

    position:absolute;

    inset:8px;

    border:
        2px solid
        #078b83;

    background:
        repeating-linear-gradient(
            135deg,
            rgba(255,255,255,.22) 0px,
            rgba(255,255,255,.22) 7px,
            transparent 7px,
            transparent 15px
        );
}


/* ==================================================
   DECORATIVE DOTS
================================================== */

.dot{

    position:absolute;

    z-index:5;

    width:25px;
    height:25px;

    border-radius:50%;

    background:#ed5b91;

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,.15);

    top:45px;
}

.dot-right{
    right:52px;
}

.dot-left{
    left:52px;
}


/* ==================================================
   SURAH CENTER
================================================== */

.surah-center{

    position:absolute;

    z-index:10;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:102px;
    height:102px;

    border-radius:50%;

    background:#f8eab1;

    border:
        5px solid
        #008b83;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.14);
}

.surah-center::after{

    content:"";

    position:absolute;

    inset:5px;

    border:
        1px solid
        rgba(128,101,25,.5);

    border-radius:50%;
}

.surah-center strong{

    font-family:'Amiri Quran',serif;

    font-size:19px;

    font-weight:400;

    line-height:1.4;

    position:relative;

    z-index:2;
}

.surah-center span{

    font-size:9px;

    position:relative;

    z-index:2;

    margin-top:2px;
}


/* ==================================================
   SURAH INFO
================================================== */

.surah-info{

    position:absolute;

    z-index:10;

    top:50%;

    transform:
        translateY(-50%);

    text-align:center;

    color:#111;
}

.surah-info.right{
    right:12px;
}

.surah-info.left{
    left:12px;
}

.surah-info strong{

    display:block;

    font-family:'Amiri Quran',serif;

    font-size:18px;
}

.surah-info span{

    display:block;

    font-size:15px;

    margin-top:1px;
}


/* ==================================================
   QURAN PAPER
================================================== */

.quran-paper{

    position:relative;

    background:#e0f2f3;

    padding:
        35px
        20px
        58px;

    overflow:hidden;
}


/* ==================================================
   PAPER DECORATION
================================================== */

.quran-paper::before{

    content:"";

    position:absolute;

    top:0;

    right:10px;
    left:10px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,128,120,.28),
            transparent
        );
}


/* ==================================================
   BISMILLAH
================================================== */

.bismillah{

    text-align:center;

    font-family:'Amiri Quran',serif;

    font-size:38px;

    line-height:2;

    margin-bottom:27px;

    color:#111;
}


/* ==================================================
   QURAN TEXT
================================================== */

.quran-text{

    direction:rtl;

    text-align:right;

    font-family:'Amiri Quran',serif;

    font-size:31px;

    line-height:2.45;

    word-spacing:2px;

    color:#080808;

    font-weight:400;
}


/* ==================================================
   AYAH
================================================== */

.ayah{
    display:inline;
}


/* ==================================================
   AYAH NUMBER
================================================== */

.ayah-number{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    vertical-align:middle;

    width:40px;
    height:40px;

    margin:
        0 5px;

    border:
        2px solid
        #171717;

    border-radius:50%;

    font-family:'Amiri',serif;

    font-size:17px;

    line-height:1;

    color:#111;

    flex-shrink:0;
}


/* ==================================================
   SURAH END
================================================== */

.surah-end{

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            90deg,
            #008c84,
            #00a096,
            #008c84
        );

    color:#f5e5aa;

    font-family:'Amiri Quran',serif;

    font-size:19px;

    letter-spacing:3px;
}


/* ==================================================
   NEXT LOADING
================================================== */

.next-loading{

    display:none;

    min-height:130px;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:8px;

    color:#50716e;

    font-family:'Cairo',sans-serif;
}

.next-loading .book{
    font-size:30px;
}


/* ==================================================
   ERROR
================================================== */

.error{

    display:none;

    text-align:center;

    padding:70px 20px;

    color:#50615f;
}

.error-icon{

    font-size:45px;

    margin-bottom:15px;
}

.error button{

    margin-top:18px;

    border:0;

    padding:
        11px 22px;

    border-radius:25px;

    background:#008f85;

    color:white;

    font-family:'Cairo',sans-serif;

    cursor:pointer;
}


/* ==================================================
   FONT CONTROLS
================================================== */

.font-controls{

    position:fixed;

    left:13px;

    bottom:84px;

    z-index:1500;

    display:flex;

    flex-direction:column;

    gap:9px;
}

.font-btn{

    width:48px;
    height:48px;

    border-radius:50%;

    border:
        1px solid
        rgba(0,130,120,.15);

    background:#fffdf7;

    color:#00877e;

    font-size:22px;

    font-weight:800;

    box-shadow:
        0 5px 17px
        rgba(0,0,0,.16);

    cursor:pointer;

    transition:.2s;
}

.font-btn:active{
    transform:scale(.92);
}


/* ==================================================
   BOTTOM NAV
================================================== */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;
    right:0;

    height:68px;

    z-index:2000;

    display:flex;

    background:#00978c;

    box-shadow:
        0 -4px 15px
        rgba(0,0,0,.16);
}

.bottom-btn{

    flex:1;

    border:0;

    background:transparent;

    color:white;

    font-family:'Cairo',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}

.bottom-btn:active{

    background:
        rgba(255,255,255,.12);
}


/* ==================================================
   LAST SURAH MESSAGE
================================================== */

.finish-message{

    display:none;

    text-align:center;

    padding:30px 20px 70px;

    color:#52716e;

    font-family:'Cairo',sans-serif;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:500px){

    .header{
        height:73px;
    }

    .header-title h1{
        font-size:26px;
    }

    .header-title p{
        font-size:8px;
    }

    .surah-header{

        height:112px;

        margin:
            7px
            5px
            0;
    }

    .surah-center{

        width:91px;
        height:91px;
    }

    .surah-center strong{
        font-size:17px;
    }

    .dot{

        width:23px;
        height:23px;

        top:40px;
    }

    .dot-right{
        right:42px;
    }

    .dot-left{
        left:42px;
    }

    .surah-info.right{
        right:8px;
    }

    .surah-info.left{
        left:8px;
    }

    .surah-info strong{
        font-size:15px;
    }

    .surah-info span{
        font-size:12px;
    }

    .quran-paper{

        padding:
            27px
            13px
            48px;
    }

    .bismillah{

        font-size:32px;

        margin-bottom:22px;
    }

    .quran-text{

        font-size:28px;

        line-height:2.4;

        word-spacing:1px;
    }

    .ayah-number{

        width:36px;
        height:36px;

        font-size:15px;

        margin:
            0 4px;
    }

    .font-controls{

        left:10px;

        bottom:76px;
    }

    .font-btn{

        width:44px;
        height:44px;
    }

    .bottom-nav{
        height:62px;
    }

    .bottom-btn{
        font-size:14px;
    }

}


/* ==================================================
   SMALL PHONES
================================================== */

@media(max-width:350px){

    .quran-text{

        font-size:24px;

        line-height:2.45;
    }

    .bismillah{
        font-size:28px;
    }

    .surah-center{

        width:80px;
        height:80px;
    }

    .surah-center strong{
        font-size:14px;
    }

    .surah-info strong{
        font-size:13px;
    }

    .surah-info span{
        font-size:10px;
    }

}

</style>

</head>

     HEADER
================================================== -->

        <button

const params =
    new URLSearchParams(
        window.location.search
    );


let currentSurah =
    parseInt(
        params.get("surah")
    ) || 1;


if(currentSurah < 1){
    currentSurah = 1;
}

if(currentSurah > 114){
    currentSurah = 114;
}

const API_EDITIONS = [

    "quran-uthmani-quran-academy",

    "quran-uthmani"

];


/* ==================================================
   LOAD SURAH
================================================== */

async function loadSurah(number){

    if(
        number < 1 ||
        number > 114
    ){
        return false;
    }


    if(
        loaded.has(number)
    ){
        return true;
    }


    if(loadingSurah){
        return false;
    }


    loadingSurah = true;


    document.getElementById(
        "loading"
    ).style.display = "flex";


    document.getElementById(
        "error"
    ).style.display = "none";


    let success = false;

    let data = null;


    try{

        for(
            const edition
            of API_EDITIONS
        ){

            try{

                const url =
                    "https://api.alquran.cloud/v1/surah/" +
                    number +
                    "/" +
                    edition;


                const response =
                    await fetch(
                        url,
                        {
                            method:"GET",
                            cache:"no-store"
                        }
                    );


                if(
                    !response.ok
                ){
                    continue;
                }


                const result =
                    await response.json();


                if(
                    result &&
                    result.data &&
                    Array.isArray(
                        result.data.ayahs
                    )
                ){

                    data =
                        result.data;

                    success =
                        true;

                    break;
                }

            }
            catch(innerError){

                console.log(
                    "Edition failed:",
                    edition,
                    innerError
                );

            }

        }


        if(!success){

            throw new Error(
                "لم يتم الحصول على بيانات السورة"
            );

        }


        createSurah(data);


        loaded.add(number);

            "loading"
        ).style.display = "none";


        return true;
