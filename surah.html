<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ATHAR | المصحف الشريف</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#e4f4f6;
    color:#111;
    font-family:"Amiri",serif;
    min-height:100vh;
    padding-bottom:75px;
}

/* =========================
   HEADER
========================= */

.header{

    height:105px;

    background:#079b91;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 18px;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);

}

.header-title{

    text-align:right;

}

.header-title h1{

    font-size:34px;

    line-height:1.1;

    font-weight:bold;

}

.header-title p{

    font-family:"Cairo",sans-serif;

    font-size:12px;

    opacity:.85;

    margin-top:4px;

    letter-spacing:1px;

}

.back{

    width:62px;

    height:62px;

    border-radius:50%;

    border:1px solid
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}

/* =========================
   PAGE
========================= */

.page{

    max-width:900px;

    margin:auto;

}

/* =========================
   LOADING
========================= */

.loading{

    min-height:550px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-family:"Cairo",sans-serif;

    color:#078d87;

}

.loading-icon{

    font-size:65px;

    margin-bottom:15px;

}

.loading-text{

    font-size:18px;

}

/* =========================
   ERROR
========================= */

.error{

    min-height:500px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    text-align:center;

    font-family:"Cairo",sans-serif;

}

.error-box{

    background:white;

    border-radius:20px;

    padding:30px;

    max-width:500px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.1);

}

.error-box h2{

    margin:12px 0;

}

.retry{

    margin-top:20px;

    padding:12px 25px;

    border:0;

    border-radius:12px;

    background:#079b91;

    color:white;

    font-family:"Cairo",sans-serif;

    font-size:16px;

}

/* =========================
   MUSHAF TOP
========================= */

.mushaf-top{

    height:105px;

    margin:0 15px;

    position:relative;

    overflow:hidden;

    border:5px solid #087e82;

    background:

        linear-gradient(
            90deg,
            #079b91,
            #e8a1bd,
            #079b91,
            #f0d36b,
            #079b91,
            #e8a1bd,
            #079b91
        );

    box-shadow:
        inset 0 0 0 3px #f1d36d;

    display:flex;

    align-items:center;

    justify-content:center;

}

/* الزخارف */

.mushaf-top:before,
.mushaf-top:after{

    content:"";

    position:absolute;

    width:90px;

    height:75px;

    top:10px;

    background:#0a9997;

    border:4px solid #e8a1bd;

    transform:skewX(-18deg);

}

.mushaf-top:before{

    right:20px;

}

.mushaf-top:after{

    left:20px;

}

/* مركز الزخرفة */

.mushaf-center{

    width:100px;

    height:75px;

    border-radius:50%;

    background:#f3e6a5;

    border:4px solid #087f82;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    z-index:2;

    font-family:"Cairo",sans-serif;

    font-weight:bold;

}

.mushaf-center div{

    text-align:center;

}

.mushaf-center small{

    display:block;

    font-size:11px;

}

.mushaf-center strong{

    display:block;

    font-size:20px;

}

/* =========================
   SURAH TITLE
========================= */

.surah-heading{

    text-align:center;

    padding:25px 15px 15px;

}

.bismillah{

    font-size:40px;

    font-weight:bold;

    margin-bottom:15px;

}

.surah-name{

    display:inline-block;

    padding:8px 28px;

    border-top:2px solid #078d87;

    border-bottom:2px solid #078d87;

    color:#07857f;

    font-size:27px;

}

/* =========================
   QURAN
========================= */

.quran{

    padding:5px 18px 35px;

    font-size:32px;

    line-height:2.25;

    text-align:justify;

    direction:rtl;

}

/* الآية */

.ayah{

    display:inline;

}

/* رقم الآية */

.ayah-number{

    display:inline-flex;

    width:42px;

    height:42px;

    border:2px solid #222;

    border-radius:50%;

    align-items:center;

    justify-content:center;

    vertical-align:middle;

    margin:

        0 6px;

    font-size:18px;

    font-family:"Amiri",serif;

    background:#e4f4f6;

}

/* =========================
   BOTTOM
========================= */

.bottom{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:72px;

    background:#079b91;

    display:flex;

    z-index:2000;

    box-shadow:
        0 -3px 12px rgba(0,0,0,.15);

}

.bottom button{

    flex:1;

    border:0;

    background:transparent;

    color:white;

    font-family:"Cairo",sans-serif;

    font-size:18px;

}

/* =========================
   FONT CONTROLS
========================= */

.font-controls{

    position:fixed;

    left:18px;

    bottom:95px;

    z-index:1500;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.font-controls button{

    width:58px;

    height:58px;

    border:0;

    border-radius:50%;

    background:white;

    color:#078d87;

    font-size:28px;

    font-weight:bold;

    box-shadow:
        0 4px 15px rgba(0,0,0,.13);

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header-title h1{

        font-size:31px;

    }

    .back{

        width:58px;

        height:58px;

        font-size:44px;

    }

    .mushaf-top{

        height:90px;

    }

    .quran{

        font-size:29px;

        line-height:2.25;

        padding:
            5px 10px 35px;

    }

    .ayah-number{

        width:37px;

        height:37px;

        font-size:16px;

        margin:0 4px;

    }

    .bismillah{

        font-size:34px;

    }

    .surah-name{

        font-size:24px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="back"
        onclick="goBack()">

        ‹

    </button>


    <div class="header-title">

        <h1 id="surahTitle">
            سورة الفاتحة
        </h1>

        <p>
            ATHAR
            &nbsp; • &nbsp;
            المصحف الشريف
        </p>

    </div>

</header>



<!-- =========================
     CONTENT
========================= -->

<main class="page">

    <div id="content">

        <div class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div class="loading-text">
                جاري فتح المصحف...
            </div>

        </div>

    </div>

</main>



<!-- =========================
     FONT BUTTONS
========================= -->

<div class="font-controls">

    <button onclick="changeFont(2)">
        +
    </button>

    <button onclick="changeFont(-2)">
        −
    </button>

</div>



<!-- =========================
     BOTTOM
========================= -->

<nav class="bottom">

    <button onclick="previousSurah()">
        السابق
    </button>

    <button onclick="goQuran()">
        القرآن
    </button>

    <button onclick="nextSurah()">
        التالي
    </button>

</nav>



<script>

/* =========================================
   ATHAR
   QURAN READER
========================================= */


/* رقم السورة من الرابط */

const params =
    new URLSearchParams(
        window.location.search
    );

let surahNumber =
    Number(
        params.get("surah")
    ) || 1;


/* حماية الرقم */

if(surahNumber < 1){

    surahNumber = 1;

}

if(surahNumber > 114){

    surahNumber = 114;

}


/* أسماء السور */

const names = [

"الفاتحة",
"البقرة",
"آل عمران",
"النساء",
"المائدة",
"الأنعام",
"الأعراف",
"الأنفال",
"التوبة",
"يونس",
"هود",
"يوسف",
"الرعد",
"إبراهيم",
"الحجر",
"النحل",
"الإسراء",
"الكهف",
"مريم",
"طه",
"الأنبياء",
"الحج",
"المؤمنون",
"النور",
"الفرقان",
"الشعراء",
"النمل",
"القصص",
"العنكبوت",
"الروم",
"لقمان",
"السجدة",
"الأحزاب",
"سبأ",
"فاطر",
"يس",
"الصافات",
"ص",
"الزمر",
"غافر",
"فصلت",
"الشورى",
"الزخرف",
"الدخان",
"الجاثية",
"الأحقاف",
"محمد",
"الفتح",
"الحجرات",
"ق",
"الذاريات",
"الطور",
"النجم",
"القمر",
"الرحمن",
"الواقعة",
"الحديد",
"المجادلة",
"الحشر",
"الممتحنة",
"الصف",
"الجمعة",
"المنافقون",
"التغابن",
"الطلاق",
"التحريم",
"الملك",
"القلم",
"الحاقة",
"المعارج",
"نوح",
"الجن",
"المزمل",
"المدثر",
"القيامة",
"الإنسان",
"المرسلات",
"النبأ",
"النازعات",
"عبس",
"التكوير",
"الانفطار",
"المطففين",
"الانشقاق",
"البروج",
"الطارق",
"الأعلى",
"الغاشية",
"الفجر",
"البلد",
"الشمس",
"الليل",
"الضحى",
"الشرح",
"التين",
"العلق",
"القدر",
"البينة",
"الزلزلة",
"العاديات",
"القارعة",
"التكاثر",
"العصر",
"الهمزة",
"الفيل",
"قريش",
"الماعون",
"الكوثر",
"الكافرون",
"النصر",
"المسد",
"الإخلاص",
"الفلق",
"الناس"

];


/* =========================================
   BACK
========================================= */

function goBack(){

    window.location.href =
        "quran.html";

}


/* =========================================
   QURAN LIST
========================================= */

function goQuran(){

    window.location.href =
        "quran.html";

}


/* =========================================
   API
========================================= */

async function getSurah(number){

    const url =
        "https://api.alquran.cloud/v1/surah/"
        + number
        + "/quran-uthmani-quran-academy";


    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "API ERROR "
            + response.status
        );

    }


    const result =
        await response.json();


    if(
        !result ||
        !result.data ||
        !result.data.ayahs
    ){

        throw new Error(
            "No Quran data"
        );

    }


    return result.data;

}


/* =========================================
   CREATE PAGE
========================================= */

function showSurah(data){

    const content =
        document.getElementById(
            "content"
        );


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " +
        names[
            data.number - 1
        ];


    content.innerHTML = "";


    /* زخرفة */

    const mushaf =
        document.createElement(
            "div"
        );

    mushaf.className =
        "mushaf-top";


    const center =
        document.createElement(
            "div"
        );

    center.className =
        "mushaf-center";


    center.innerHTML = `

        <div>

            <small>
                السورة
            </small>

            <strong>
                ${data.number}
            </strong>

        </div>

    `;


    mushaf.appendChild(center);

    content.appendChild(mushaf);


    /* عنوان السورة */

    const heading =
        document.createElement(
            "div"
        );

    heading.className =
        "surah-heading";


    /*
       الفاتحة:
       أول آية فيها البسملة،
       لذلك لا نضيف بسملة منفصلة.
    */

    if(
        data.number !== 1 &&
        data.number !== 9
    ){

        const bismillah =
            document.createElement(
                "div"
            );

        bismillah.className =
            "bismillah";

        bismillah.textContent =
            "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";

        heading.appendChild(
            bismillah
        );

    }


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "surah-name";

    name.textContent =
        "سُورَةُ " +
        names[
            data.number - 1
        ];


    heading.appendChild(name);

    content.appendChild(heading);


    /* النص */

    const quran =
        document.createElement(
            "div"
        );

    quran.className =
        "quran";


    data.ayahs.forEach(
        function(ayah){

            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "ayah";

            text.textContent =
                ayah.text;


            const number =
                document.createElement(
                    "span"
                );

            number.className =
                "ayah-number";

            number.textContent =
                arabicNumber(
                    ayah.numberInSurah
                );


            quran.appendChild(text);

            quran.appendChild(number);

        }
    );


    content.appendChild(quran);


    applyFont();

}


/* =========================================
   ARABIC NUMBERS
========================================= */

function arabicNumber(number){

    const digits = [
        "٠","١","٢","٣","٤",
        "٥","٦","٧","٨","٩"
    ];


    return String(number)
        .split("")
        .map(
            function(x){

                return digits[
                    Number(x)
                ];

            }
        )
        .join("");

}


/* =========================================
   LOAD
========================================= */

async function load(){

    try{

        const data =
            await getSurah(
                surahNumber
            );


        showSurah(data);


    }catch(error){

        console.error(error);


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="error">

                <div class="error-box">

                    <div style="font-size:60px;">
                        📖
                    </div>

                    <h2>
                        لم نتمكن من فتح السورة
                    </h2>

                    <p>
                        يبدو أن الاتصال بمصدر
                        القرآن لم يكتمل.
                    </p>

                    <button
                        class="retry"
                        onclick="load()">

                        إعادة المحاولة

                    </button>

                </div>

            </div>

        `;

    }

}


/* =========================================
   FONT
========================================= */

let fontSize =
    Number(
        localStorage.getItem(
            "athar-font-size"
        )
    ) || 32;


function changeFont(amount){

    fontSize += amount;


    if(fontSize < 22){

        fontSize = 22;

    }


    if(fontSize > 48){

        fontSize = 48;

    }


    localStorage.setItem(
        "athar-font-size",
        fontSize
    );


    applyFont();

}


function applyFont(){

    const quran =
        document.querySelector(
            ".quran"
        );


    if(quran){

        quran.style.fontSize =
            fontSize + "px";

    }

}


/* =========================================
   PREVIOUS
========================================= */

function previousSurah(){

    if(surahNumber <= 1){

        return;

    }


    window.location.href =
        "surah.html?surah="
        + (surahNumber - 1);

}


/* =========================================
   NEXT
========================================= */

function nextSurah(){

    if(surahNumber >= 114){

        return;

    }


    window.location.href =
        "surah.html?surah="
        + (surahNumber + 1);

}


/* =========================================
   START
========================================= */

load();

</script>

</body>
    </html>
