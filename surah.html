    inset:10px;

   PAGE CONTENT
================================ */

================================ */

================================ */

.page-number::before{

}


.page-number::after{

    content:"۞";

    margin-right:8px;

    color:#9b7b42;

}


/* ================================
   JUZ SIDE
================================ */

.juz-side{

    position:absolute;

    top:30px;

    right:0;

    color:white;

================================ */

}


.loading-sub{

    margin-top:8px;

    font-size:12px;

    color:#788c89;

}


@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{

    }

}

================================ */

/* =====================================================
   GET SURAH NUMBER
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

let surahNumber =
    parseInt(
        urlParams.get("surah")
    ) || 1;


if(surahNumber < 1){

    surahNumber = 1;

}


if(surahNumber > 114){

    surahNumber = 114;

}


/* =====================================================
   CURRENT SURAH NAME
===================================================== */

const currentSurahName =
    surahNames[surahNumber - 1];


/* =====================================================
   UPDATE HEADER
===================================================== */

function updateHeader(){

    document.title =
        "أثر | سورة " +
        currentSurahName;


    document.getElementById(
        "headerTitle"
    ).textContent =
        "سورة " +
        currentSurahName;


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " +
        currentSurahName;


    document.getElementById(
        "juzTitle"
    ).textContent =
        "المصحف الشريف";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TAJWEED PARSER
===================================================== */

function parseTajweed(text){

    let safe =
        escapeHTML(text);


    /*
       العلامات القادمة من quran-tajweed
    */

    safe =
        safe.replace(
            /\[([a-z]+)(?::\d+)?\[([^\]]*)\]/gi,

            function(
                match,
                tag,
                content
            ){

                return (
                    '<span class="tj-' +
                    tag.toLowerCase() +
                    '">' +
                    content +
                    '</span>'
                );

            }
        );


    safe =
        safe.replace(
            /\[([a-z]+)\[([^\]]*)\]/gi,

            function(
                match,
                tag,
                content
            ){

                return (
                    '<span class="tj-' +
                    tag.toLowerCase() +
                    '">' +
                    content +
                    '</span>'
                );

            }
        );


    /*
       إزالة أي علامات متبقية
    */

    safe =
        safe.replace(
            /\[[a-z]+(?::\d+)?/gi,
            ""
        );


    safe =
        safe.replace(
            /\]/g,
            ""
        );


    return safe;

}


/* =====================================================
   CREATE AYAH
===================================================== */

function createAyah(ayah){

    let text =
        ayah.text || "";


    let rendered =
        escapeHTML(text);


    /*
       إذا كان النص من نسخة التجويد
       سنحوّل العلامات إلى ألوان.
    */

    if(
        text.indexOf("[") !== -1
    ){

        rendered =
            parseTajweed(text);

    }


    return `

        <span class="ayah">

            ${rendered}

            <span class="ayah-number">

                ${ayah.numberInSurah}

            </span>

        </span>

    `;

}

   LOAD SURAH
===================================================== */

    const mushaf =
        document.getElementById(
            "mushaf"
        );


    mushaf.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div class="loading-title">
                جاري فتح سورة ${currentSurahName}...
            </div>

            <div class="loading-sub">
                تحميل الآيات بالتشكيل
            </div>

        </div>

    `;

       نستخدم نسخة عثمانية موثوقة أولاً.
       بيانات الآيات تتضمن رقم الصفحة.
    */

        const response =
            await fetch(

                "https://api.alquran.cloud/v1/surah/" +

                "/quran-uthmani-quran-academy"

            );


        if(!response.ok){

            throw new Error(
                "API ERROR"
            );

        }


        const result =
            await response.json();


        if(
            !result.data ||
            !result.data.ayahs
        ){

            throw new Error(
                "NO AYAH DATA"
            );

        }


        const ayahs =
            result.data.ayahs;


        /*
           نحاول جلب التجويد في الخلفية.
           لو فشل لن يؤثر على ظهور القرآن.
        */

        let tajweedAyahs = null;


        try{

            const tajResponse =
                await fetch(

                    "https://api.alquran.cloud/v1/surah/" +
                    surahNumber +
                    "/quran-tajweed"

                );


            if(tajResponse.ok){

                const tajResult =
                    await tajResponse.json();


                if(
                    tajResult.data &&
                    tajResult.data.ayahs
                ){

                    tajweedAyahs =
                        tajResult.data.ayahs;

                }

            }

        }catch(tajError){

            console.log(
                "Tajweed unavailable"
            );

        /*
           لو التجويد موجود،
           نستبدل النصوص بنسخة التجويد.
        */

        if(tajweedAyahs){

            const tajMap =
                new Map();


            tajweedAyahs.forEach(
                function(ayah){

                    tajMap.set(
                        ayah.numberInSurah,
                        ayah.text
                    );

                }
            );


            ayahs.forEach(
                function(ayah){

                    if(
