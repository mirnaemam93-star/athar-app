<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المصحف | أَثَر</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri+Quran&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#dceff1;

    color:#111;

    font-family:'Cairo',sans-serif;

    min-height:100vh;

    padding-bottom:80px;

}


/* =================================
   HEADER
================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:76px;

    background:linear-gradient(
        135deg,
        #008f83,
        #009d91
    );

    color:white;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

}

.header-inner{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

}

.surah-title{

    font-family:'Amiri Quran','Amiri',serif;

    font-size:27px;

    font-weight:700;

}

.juz-title{

    font-family:'Amiri Quran','Amiri',serif;

    font-size:24px;

    font-weight:700;

}

.menu{

    font-size:29px;

    line-height:1;

}


/* =================================
   MAIN
================================= */

.page{

    width:100%;

    max-width:650px;

    margin:auto;

}


/* =================================
   DECORATIVE SURAH HEADER
================================= */

.surah-banner{

    margin:0 7px;

    height:112px;

    position:relative;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 15% 50%,
            #e987a6 0 13px,
            transparent 14px
        ),

        radial-gradient(
            circle at 85% 50%,
            #e987a6 0 13px,
            transparent 14px
        ),

        linear-gradient(
            90deg,
            #008e8d,
            #d9e9e5 25%,
            #f4df9b 50%,
            #d9e9e5 75%,
            #008e8d
        );

    border-left:4px solid #078c88;

    border-right:4px solid #078c88;

}


/* الزخرفة الخارجية */

.surah-banner:before{

    content:"";

    position:absolute;

    inset:8px;

    border:5px solid #008d8c;

    background:

        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.25) 0px,
            rgba(255,255,255,.25) 7px,
            transparent 7px,
            transparent 14px
        );

}


/* الدائرة الوسطى */

.banner-center{

    position:absolute;

    z-index:3;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    width:94px;

    height:94px;

    border-radius:50%;

    background:#f8e9ad;

    border:4px solid #07928c;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:#111;

    box-shadow:0 2px 7px rgba(0,0,0,.12);

}

.banner-center span{

    font-family:'Amiri Quran',serif;

    font-size:19px;

    font-weight:700;

}

.banner-center small{

    font-size:11px;

    margin-top:2px;

}


/* معلومات الجنب */

.banner-info{

    position:absolute;

    z-index:4;

    top:50%;

    transform:translateY(-50%);

    text-align:center;

    font-family:'Amiri Quran',serif;

    color:#111;

}

.banner-info.right{

    right:16px;

}

.banner-info.left{

    left:16px;

}

.banner-info strong{

    display:block;

    font-size:17px;

}

.banner-info span{

    font-family:'Cairo',sans-serif;

    font-size:15px;

}


/* =================================
   QURAN AREA
================================= */

.quran-area{

    background:#dff1f3;

    padding:25px 15px 40px;

    min-height:600px;

}


/* =================================
   BISMILLAH
================================= */

.bismillah{

    text-align:center;

    font-family:'Amiri Quran',serif;

    font-size:37px;

    line-height:2;

    color:#111;

    margin:0 auto 22px;

}

.hide-bismillah{

    display:none;

}


/* =================================
   QURAN TEXT
================================= */

.quran-text{

    font-family:'Amiri Quran','Amiri',serif;

    font-size:31px;

    line-height:2.35;

    text-align:right;

    color:#080808;

    direction:rtl;

}


/* =================================
   AYAH
================================= */

.ayah{

    display:inline;

}


/* آية مميزة */

.ayah-mark{

    display:inline-flex;

    width:42px;

    height:42px;

    margin:0 5px;

    vertical-align:middle;

    align-items:center;

    justify-content:center;

    border:2px solid #222;

    border-radius:50%;

    font-family:'Amiri',serif;

    font-size:17px;

    color:#111;

    background:transparent;

}


/* =================================
   LOADING
================================= */

.loading{

    min-height:450px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:15px;

    color:#555;

}

.loading-icon{

    font-size:45px;

    animation:pulse 1.3s infinite;

}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.12);
        opacity:1;
    }

}


/* =================================
   ERROR
================================= */

.error{

    display:none;

    text-align:center;

    padding:70px 20px;

    color:#555;

}

.error-icon{

    font-size:45px;

    margin-bottom:15px;

}


/* =================================
   BOTTOM NAVIGATION
================================= */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:65px;

    background:#00988d;

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:2000;

    box-shadow:0 -3px 12px rgba(0,0,0,.15);

}

.bottom-btn{

    flex:1;

    height:100%;

    border:0;

    background:transparent;

    color:white;

    font-family:'Cairo',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

}

.bottom-btn:active{

    background:rgba(255,255,255,.1);

}


/* =================================
   CONTROLS
================================= */

.controls{

    position:fixed;

    left:12px;

    bottom:78px;

    z-index:1500;

    display:flex;

    flex-direction:column;

    gap:7px;

}

.control{

    width:42px;

    height:42px;

    border-radius:50%;

    border:1px solid rgba(0,0,0,.12);

    background:#fff;

    color:#008d83;

    font-size:18px;

    font-weight:800;

    box-shadow:0 3px 10px rgba(0,0,0,.12);

    cursor:pointer;

}


/* =================================
   MOBILE
================================= */

@media(max-width:500px){

    .header{

        height:70px;

    }

    .surah-title{

        font-size:24px;

    }

    .juz-title{

        font-size:21px;

    }

    .menu{

        font-size:26px;

    }

    .surah-banner{

        height:105px;

        margin:0 5px;

    }

    .banner-center{

        width:86px;

        height:86px;

    }

    .banner-center span{

        font-size:17px;

    }

    .banner-info.right{

        right:9px;

    }

    .banner-info.left{

        left:9px;

    }

    .banner-info strong{

        font-size:15px;

    }

    .banner-info span{

        font-size:13px;

    }

    .quran-area{

        padding:22px 13px 35px;

    }

    .bismillah{

        font-size:31px;

    }

    .quran-text{

        font-size:27px;

        line-height:2.3;

    }

    .ayah-mark{

        width:36px;

        height:36px;

        font-size:15px;

    }

    .bottom-nav{

        height:62px;

    }

    .bottom-btn{

        font-size:14px;

    }

}


/* =================================
   VERY SMALL PHONES
================================= */

@media(max-width:350px){

    .quran-text{

        font-size:24px;

        line-height:2.35;

    }

    .bismillah{

        font-size:28px;

    }

    .banner-center{

        width:76px;

        height:76px;

    }

    .banner-info strong{

        font-size:13px;

    }

    .banner-info span{

        font-size:11px;

    }

}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<header class="header">

    <div class="header-inner">


        <div
            class="menu"
            onclick="goBack()">

            ⋮

        </div>


        <div
            class="juz-title"
            id="juzTitle">

            الجزء

        </div>


        <div
            class="surah-title"
            id="headerSurah">

            سورة

        </div>


    </div>

</header>



<main class="page">


    <!-- =================================
         SURAH DECORATION
    ================================= -->

    <section class="surah-banner">


        <div class="banner-info right">

            <strong>
                آيات
            </strong>

            <span id="ayahCount">
                -
            </span>

        </div>


        <div class="banner-center">

            <span id="bannerSurah">
                السورة
            </span>

            <small>
                بِسْمِ الله
            </small>

        </div>


        <div class="banner-info left">

            <strong>
                رقم
            </strong>

            <span id="surahNumber">
                -
            </span>

        </div>


    </section>



    <!-- =================================
         QURAN
    ================================= -->

    <section class="quran-area">


        <div
            id="bismillah"
            class="bismillah">

            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

        </div>


        <div
            id="loading"
            class="loading">

            <div class="loading-icon">
                📖
            </div>

            <div>
                جاري تحميل السورة...
            </div>

        </div>


        <div
            id="quranText"
            class="quran-text">
        </div>


        <div
            id="error"
            class="error">

            <div class="error-icon">
                ⚠️
            </div>

            <h3>
                تعذر تحميل السورة
            </h3>

            <p>
                تأكد من اتصال الإنترنت ثم حاول مرة أخرى.
            </p>

        </div>


    </section>


</main>



<!-- =================================
     FONT CONTROLS
================================= -->

<div class="controls">

    <button
        class="control"
        onclick="changeFont(2)">

        +

    </button>

    <button
        class="control"
        onclick="changeFont(-2)">

        −

    </button>

</div>



<!-- =================================
     BOTTOM
================================= -->

<nav class="bottom-nav">


    <button
        class="bottom-btn"
        onclick="previousSurah()">

        السابق

    </button>


    <button
        class="bottom-btn"
        onclick="goBack()">

        القرآن

    </button>


    <button
        class="bottom-btn"
        onclick="nextSurah()">

        التالي

    </button>


</nav>



<script>


/* =================================
   GET SURAH NUMBER
================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let surahNumber =
    parseInt(
        params.get("surah")
    ) || 1;


if(surahNumber < 1){

    surahNumber = 1;

}


if(surahNumber > 114){

    surahNumber = 114;

}


/* =================================
   FONT SIZE
================================= */

let fontSize = 31;


/* =================================
   LOAD SURAH
================================= */

async function loadSurah(){

    try{

        const response =
            await fetch(
                "https://api.alquran.cloud/v1/surah/" +
                surahNumber +
                "/quran-uthmani"
            );


        if(!response.ok){

            throw new Error(
                "Failed to load"
            );

        }


        const result =
            await response.json();


        if(
            !result.data ||
            !result.data.ayahs
        ){

            throw new Error(
                "No data"
            );

        }


        const surah =
            result.data;


        /* =========================
           معلومات السورة
        ========================= */

        document.getElementById(
            "headerSurah"
        ).textContent =
            surah.name;


        document.getElementById(
            "bannerSurah"
        ).textContent =
            surah.name;


        document.getElementById(
            "ayahCount"
        ).textContent =
            surah.numberOfAyahs;


        document.getElementById(
            "surahNumber"
        ).textContent =
            surah.number;


        document.getElementById(
            "juzTitle"
        ).textContent =
            "المصحف";


        /* =========================
           البسملة
        ========================= */

        if(surahNumber === 9){

            document.getElementById(
                "bismillah"
            ).style.display =
                "none";

        }


        /* =========================
           الآيات
        ========================= */

        const quranText =
            document.getElementById(
                "quranText"
            );


        quranText.innerHTML = "";


        surah.ayahs.forEach(
            function(ayah){

                const text =
                    document.createElement(
                        "span"
                    );


                text.className =
                    "ayah";


                text.appendChild(
                    document.createTextNode(
                        ayah.text + " "
                    )
                );


                const mark =
                    document.createElement(
                        "span"
                    );


                mark.className =
                    "ayah-mark";


                mark.textContent =
                    ayah.numberInSurah;


                text.appendChild(mark);


                quranText.appendChild(
                    text
                );

            }
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "error"
        ).style.display =
            "block";

    }

}


/* =================================
   FONT
================================= */

function changeFont(amount){

    fontSize += amount;


    if(fontSize < 22){

        fontSize = 22;

    }


    if(fontSize > 40){

        fontSize = 40;

    }


    document.getElementById(
        "quranText"
    ).style.fontSize =
        fontSize + "px";

}


/* =================================
   PREVIOUS
================================= */

function previousSurah(){

    if(surahNumber > 1){

        window.location.href =
            "surah.html?surah=" +
            (surahNumber - 1);

    }

}


/* =================================
   NEXT
================================= */

function nextSurah(){

    if(surahNumber < 114){

        window.location.href =
            "surah.html?surah=" +
            (surahNumber + 1);

    }

}


/* =================================
   BACK
================================= */

function goBack(){

    window.location.href =
        "quran.html";

}


/* =================================
   START
================================= */

loadSurah();

</script>


</body>

    </html>
